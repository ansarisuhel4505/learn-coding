<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro VS-Code Style IDE - CodeMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* NAVBAR */
        .navbar { background: #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .navbar h2 { color: #3b82f6; font-size: 20px; display: flex; align-items: center; gap: 10px;}
        .controls { display: flex; gap: 15px; align-items: center; }
        
        select { background: #0f172a; color: #10b981; border: 1px solid #3b82f6; padding: 8px 12px; border-radius: 5px; outline: none; font-weight: bold; font-size: 14px; max-width: 250px; cursor: pointer;}
        .btn { background: #10b981; color: white; border: none; padding: 8px 20px; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.3s;}
        .btn:hover { background: #059669; }
        
        /* WORKSPACE LAYOUT */
        .workspace { display: flex; flex-grow: 1; height: calc(100vh - 60px); }
        .hidden { display: none !important; }

        /* 1. SIDEBAR (File Explorer) */
        .sidebar { width: 220px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-size: 13px; color: #94a3b8; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;}
        .file-list { list-style: none; overflow-y: auto; flex-grow: 1; }
        .file-item { padding: 10px 15px; font-size: 14px; cursor: pointer; color: #cbd5e1; border-bottom: 1px solid #0f172a; display: flex; justify-content: space-between; align-items: center; transition: 0.2s;}
        .file-item:hover { background: #334155; }
        .file-item.active { background: #3b82f6; color: white; border-left: 4px solid #10b981; }
        .add-file-btn { padding: 12px; background: #0f172a; color: #10b981; border: none; cursor: pointer; font-weight: bold; border-top: 1px solid #334155; transition: 0.3s; text-align: left;}
        .add-file-btn:hover { background: #10b981; color: white;}

        /* 2. EDITOR AREA */
        .editor-area { flex-grow: 1; display: flex; flex-direction: column; border-right: 2px solid #334155; width: calc(50% - 110px); }
        .editor-header { background: #1e293b; padding: 10px 20px; font-size: 14px; color: #10b981; font-weight: bold; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px;}
        .editor-area textarea { flex-grow: 1; background: #0f172a; color: #f8fafc; font-family: 'Courier New', Courier, monospace; padding: 20px; border: none; outline: none; font-size: 15px; resize: none; line-height: 1.6;}

        /* 3. OUTPUT AREA */
        .output-area { width: calc(50% - 110px); display: flex; flex-direction: column; background: #0f172a; }
        .output-header { background: #1e293b; padding: 10px 20px; font-size: 14px; color: #94a3b8; font-weight: bold; border-bottom: 1px solid #334155; }
        
        /* Output Types */
        .terminal-box { flex-grow: 1; padding: 20px; font-family: monospace; font-size: 14px; overflow-y: auto; color: #e2e8f0; white-space: pre-wrap; background: #000; }
        .web-frame { flex-grow: 1; width: 100%; height: 100%; border: none; background: white; }

        /* MODULES WORKSPACE (CodeSandbox) */
        .sandbox-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2><i class="fas fa-code"></i> Code<span>Master</span> IDE</h2>
        
        <div class="controls">
            <select id="langSelect" onchange="changeEnvironment()">
                <optgroup label="🌟 Web Development">
                    <option value="web">🌐 HTML / CSS / JS (Web Preview)</option>
                </optgroup>
                <optgroup label="📦 Full Stack Modules">
                    <option value="modules">⚡ Node.js / React (CodeSandbox)</option>
                </optgroup>
                <optgroup label="💻 Backend Languages" id="backendLangs">
                    <option value="python">🐍 PYTHON (v3.10.0)</option>
                    <option value="java">☕ JAVA (v15.0.2)</option>
                    <option value="cpp">⚙️ C++ (v10.2.0)</option>
                </optgroup>
            </select>
            
            <button class="btn" onclick="runCode()" id="runBtn"><i class="fas fa-play"></i> Run Code</button>
            <a href="/dashboard.html" style="color: #ef4444; font-weight: bold; text-decoration: none; padding: 8px 15px; border: 1px solid #ef4444; border-radius: 5px;"><i class="fas fa-sign-out-alt"></i> Exit</a>
        </div>
    </div>

    <div class="workspace" id="mainWorkspace">
        
        <div class="sidebar">
            <div class="sidebar-header">
                <span><i class="fas fa-folder-open"></i> EXPLORER</span>
            </div>
            <ul class="file-list" id="fileList">
                </ul>
            <button class="add-file-btn" onclick="createNewFile()"><i class="fas fa-plus"></i> Add New File</button>
        </div>

        <div class="editor-area">
            <div class="editor-header" id="currentFileName"><i class="fas fa-file-code"></i> index.html</div>
            <textarea id="codeEditor" onkeyup="saveCurrentFile()" spellcheck="false"></textarea>
        </div>

        <div class="output-area">
            <div class="output-header" id="outputTitle"><i class="fas fa-desktop"></i> Live Preview</div>
            
            <iframe id="webOutput" class="web-frame hidden"></iframe>
            
            <div id="terminalOutput" class="terminal-box hidden">➜ System Ready...</div>
        </div>
    </div>

    <div class="workspace hidden" id="modulesWorkspace">
        <iframe class="sandbox-frame" src="https://codesandbox.io/embed/vanilla-node?fontsize=14&hidenavigation=1&theme=dark"></iframe>
    </div>

    <script>
        let files = {};
        let activeFile = "";
        let currentMode = "web"; // 'web', 'backend', or 'modules'
        
        const defaultVersions = { "python": "3.10.0", "javascript": "18.15.0", "java": "15.0.2", "cpp": "10.2.0", "c": "10.2.0" };
        let globalVersions = { ...defaultVersions };

        document.addEventListener("DOMContentLoaded", () => {
            fetch70PlusLangs();
            changeEnvironment(); // Initialize default (Web)
        });

        // ==========================================
        // 1. FETCH 70+ LANGUAGES (Background)
        // ==========================================
        async function fetch70PlusLangs() {
            try {
                const res = await fetch('https://emkc.org/api/v2/piston/runtimes');
                const data = await res.json();
                const optGroup = document.getElementById('backendLangs');
                optGroup.innerHTML = ''; 
                
                data.sort((a, b) => a.language.localeCompare(b.language)).forEach(rt => {
                    globalVersions[rt.language] = rt.version;
                    optGroup.innerHTML += `<option value="${rt.language}">${rt.language.toUpperCase()} (v${rt.version})</option>`;
                });
            } catch (err) { console.log("Using default fallback languages."); }
        }

        // ==========================================
        // 2. ENVIRONMENT SWITCHER
        // ==========================================
        function changeEnvironment() {
            const selected = document.getElementById('langSelect').value;
            const mainWs = document.getElementById('mainWorkspace');
            const modWs = document.getElementById('modulesWorkspace');
            const runBtn = document.getElementById('runBtn');

            if (selected === 'modules') {
                // CodeSandbox Mode
                currentMode = "modules";
                mainWs.classList.add('hidden');
                modWs.classList.remove('hidden');
                runBtn.style.display = 'none'; 
            } else {
                // Our Unified Workspace
                mainWs.classList.remove('hidden');
                modWs.classList.add('hidden');
                runBtn.style.display = 'flex';
                
                if (selected === 'web') {
                    currentMode = "web";
                    setupWebEnvironment();
                } else {
                    currentMode = "backend";
                    setupBackendEnvironment(selected);
                }
            }
        }

        // Setup Files for Web Dev
        function setupWebEnvironment() {
            document.getElementById('terminalOutput').classList.add('hidden');
            document.getElementById('webOutput').classList.remove('hidden');
            document.getElementById('outputTitle').innerHTML = '<i class="fas fa-globe"></i> Live Web Preview';
            
            // Generate standard web files
            files = {
                "index.html": "<!DOCTYPE html>\n<html>\n<head>\n  <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n  <div class=\"container\">\n    <h1>CodeMaster VS-Code Mode 🔥</h1>\n    <p>Write HTML, CSS, and JS in different files!</p>\n  </div>\n  <script src=\"script.js\"><\/script>\n</body>\n</html>",
                "style.css": "body { font-family: sans-serif; background: #f0f4f8; text-align: center; margin-top: 50px; }\n.container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }\nh1 { color: #3b82f6; }",
                "script.js": "console.log('Website Loaded Successfully!');"
            };
            
            refreshFileExplorer();
            openFile("index.html");
            runCode(); // Auto render
        }

        // Setup Files for Backend
        function setupBackendEnvironment(lang) {
            document.getElementById('webOutput').classList.add('hidden');
            document.getElementById('terminalOutput').classList.remove('hidden');
            document.getElementById('outputTitle').innerHTML = '<i class="fas fa-terminal"></i> Cloud Terminal';
            
            files = {};
            if (lang === 'python') {
                files['main.py'] = "import helper\n\nprint('Hello from Main File!')\nhelper.greet()";
                files['helper.py'] = "def greet():\n    print('Modules and Files are perfectly linked!')";
                activeFile = 'main.py';
            } else if (lang === 'java') {
                files['Main.java'] = "public class Main {\n  public static void main(String[] args) {\n    System.out.println(\"Hello Java World!\");\n  }\n}";
                activeFile = 'Main.java';
            } else {
                files[`main.${lang}`] = `// Start coding in ${lang.toUpperCase()}\n`;
                activeFile = `main.${lang}`;
            }

            document.getElementById('terminalOutput').innerText = "➜ Ready to execute. Click 'Run Code'.";
            refreshFileExplorer();
            openFile(activeFile);
        }

        // ==========================================
        // 3. UNIFIED FILE EXPLORER LOGIC
        // ==========================================
        function refreshFileExplorer() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            
            for (let fileName in files) {
                const isActive = fileName === activeFile ? 'active' : '';
                // Setup smart icons based on extension
                let icon = 'fa-file-code';
                if(fileName.endsWith('.html')) icon = 'fa-html5" style="color:#ef4444;';
                else if(fileName.endsWith('.css')) icon = 'fa-css3-alt" style="color:#3b82f6;';
                else if(fileName.endsWith('.js')) icon = 'fa-js" style="color:#eab308;';
                else if(fileName.endsWith('.py')) icon = 'fa-python" style="color:#10b981;';
                
                list.innerHTML += `
                    <li class="file-item ${isActive}" onclick="openFile('${fileName}')">
                        <span><i class="fab ${icon}"></i> ${fileName}</span>
                        ${Object.keys(files).length > 1 ? `<i class="fas fa-trash-alt" style="color:#ef4444;" onclick="removeFile(event, '${fileName}')"></i>` : ''}
                    </li>
                `;
            }
        }

        function openFile(fileName) {
            activeFile = fileName;
            document.getElementById('currentFileName').innerHTML = `<i class="fas fa-file-signature"></i> ${fileName}`;
            document.getElementById('codeEditor').value = files[fileName];
            refreshFileExplorer();
        }

        function saveCurrentFile() {
            files[activeFile] = document.getElementById('codeEditor').value;
        }

        function createNewFile() {
            const name = prompt("Enter file name with extension (e.g., about.html, utils.js, config.py):");
            if (name && name.trim() !== "") {
                if (!files[name]) {
                    saveCurrentFile(); 
                    files[name] = "";
                    openFile(name);
                } else {
                    alert("File already exists!");
                }
            }
        }

        function removeFile(event, fileName) {
            event.stopPropagation();
            if(confirm(`Delete ${fileName}?`)) {
                delete files[fileName];
                activeFile = Object.keys(files)[0];
                openFile(activeFile);
            }
        }

        // ==========================================
        // 4. MASTER EXECUTION LOGIC
        // ==========================================
        async function runCode() {
            saveCurrentFile();
            const runBtn = document.getElementById('runBtn');
            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';

            if (currentMode === 'web') {
                // Smart Web Compiler: Combines HTML with all CSS and JS files
                let htmlContent = files['index.html'] || "<h2>Error: Missing index.html</h2>";
                let allCss = "";
                let allJs = "";
                
                for(let fn in files) {
                    if(fn.endsWith('.css')) allCss += files[fn] + "\n";
                    if(fn.endsWith('.js') && fn !== 'index.html') allJs += files[fn] + "\n";
                }

                const finalOutput = `
                    ${htmlContent}
                    <style>${allCss}</style>
                    <script>${allJs}<\/script>
                `;
                document.getElementById('webOutput').srcdoc = finalOutput;
                runBtn.innerHTML = '<i class="fas fa-play"></i> Run Code';
                
            } else if (currentMode === 'backend') {
                // Cloud Backend Compiler
                const lang = document.getElementById('langSelect').value;
                const terminal = document.getElementById('terminalOutput');
                terminal.innerHTML = `<span style="color:#eab308;">➜ Sending ${Object.keys(files).length} files to Cloud...</span>\n`;
                
                let filesArray = Object.keys(files).map(name => ({ name: name, content: files[name] }));

                try {
                    const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ language: lang, version: globalVersions[lang], files: filesArray })
                    });
                    
                    const data = await response.json();
                    if (data.run.stderr) {
                        terminal.innerHTML += `<span style="color:#ef4444;">${data.run.stderr}</span>`;
                    } else {
                        terminal.innerHTML += `<span style="color:#10b981;">Execution Output:</span>\n${data.run.stdout}`;
                    }
                } catch (error) {
                    terminal.innerHTML = "<span style="color:#ef4444;">Error: Connection Failed.</span>";
                }
                runBtn.innerHTML = '<i class="fas fa-play"></i> Run Code';
            }
        }
    </script>
</body>
</html>

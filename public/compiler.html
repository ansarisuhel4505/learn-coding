<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro IDE - CodeMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* NAVBAR */
        .navbar { background: #1e293b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; z-index: 10; flex-shrink: 0;}
        .navbar h2 { color: #3b82f6; font-size: 22px; display: flex; align-items: center; gap: 10px; font-weight: 700;}
        .navbar h2 span { color: white; }
        
        .mode-toggle { display: flex; background: #0f172a; border-radius: 8px; border: 1px solid #334155; overflow: hidden; }
        .mode-btn { padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 14px; color: #94a3b8; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .mode-btn.active { background: #3b82f6; color: white; }
        
        .exit-btn { color: #ef4444; font-weight: bold; text-decoration: none; padding: 8px 15px; border: 1px solid #ef4444; border-radius: 5px; transition: 0.3s; display: flex; align-items: center; gap: 8px;}
        .exit-btn:hover { background: #ef4444; color: white; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .mobile-menu-btn { display: none; background: transparent; color: white; border: none; font-size: 24px; cursor: pointer; }

        /* WORKSPACE CONTAINERS */
        .workspace { display: flex; flex-grow: 1; height: calc(100vh - 70px); width: 100%; overflow: hidden;}
        .hidden { display: none !important; }

        /* 1. WEB WORKSPACE */
        .web-workspace { flex-direction: column; }
        .web-editors { display: flex; height: 50%; border-bottom: 2px solid #334155; }
        .editor-box { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #334155; background: #1e293b;}
        .editor-header { padding: 8px 15px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; background: #0f172a; border-bottom: 1px solid #334155;}
        .editor-box textarea { flex-grow: 1; background: #1e293b; color: #f8fafc; font-family: 'Courier New', monospace; padding: 15px; border: none; outline: none; resize: none; font-size: 15px;}
        .web-preview-area { height: 50%; display: flex; flex-direction: column; background: white; }
        .preview-header { background: #cbd5e1; color: #0f172a; padding: 5px 15px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px;}
        iframe { flex-grow: 1; border: none; width: 100%; height: 100%; }

        /* 2. PRO CODING WORKSPACE */
        .code-workspace { display: flex; width: 100%; position: relative;}

        /* FILE EXPLORER SIDEBAR */
        .file-explorer { width: 220px; background: #0b1120; border-right: 1px solid #334155; display: flex; flex-direction: column; flex-shrink: 0; z-index: 5; transition: 0.3s;}
        .explorer-header { padding: 12px 15px; font-size: 12px; font-weight: bold; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b;}
        .explorer-actions i { cursor: pointer; padding: 5px; transition: 0.3s; }
        .explorer-actions i:hover { color: #f8fafc; background: #1e293b; border-radius: 4px; }
        .file-list { flex-grow: 1; overflow-y: auto; padding: 10px 0; }
        .file-item { padding: 8px 15px; font-size: 13px; color: #cbd5e1; cursor: pointer; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent;}
        .file-item:hover { background: #1e293b; }
        .file-item.active { background: #1e293b; color: #3b82f6; border-left: 3px solid #3b82f6; font-weight: 500;}

        /* EDITOR AREA */
        .coding-left { flex-grow: 1; display: flex; flex-direction: column; border-right: 2px solid #334155; min-width: 0;}
        .coding-controls { padding: 10px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;}
        
        select { background: #1e293b; color: #10b981; border: 1px solid #3b82f6; padding: 6px 10px; border-radius: 5px; outline: none; font-weight: 600; font-size: 13px; cursor: pointer; max-width: 200px;}
        select optgroup { background: #0f172a; color: #94a3b8; font-weight: bold; }
        
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap;}
        .btn-ai { background: transparent; border: 1px solid #8b5cf6; color: #8b5cf6; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 5px;}
        .btn-ai:hover { background: #8b5cf6; color: white; box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }

        /* 🌟 NAYA: Run & Terminal Buttons Container */
        .run-group { display: flex; gap: 8px; }
        .run-btn { background: #10b981; color: white; border: none; padding: 6px 20px; border-radius: 5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: 0.3s;}
        .run-btn:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        
        .terminal-btn { background: #3b82f6; color: white; border: none; padding: 6px 15px; border-radius: 5px; font-weight: 700; cursor: pointer; display: none; align-items: center; gap: 8px; font-size: 13px; transition: 0.3s;}
        .terminal-btn:hover { background: #2563eb; }

        #monacoEditor { flex-grow: 1; width: 100%; text-align: left; }

        /* TERMINAL AREA (Desktop) */
        .coding-right { width: 35%; display: flex; flex-direction: column; background: #000; flex-shrink: 0;}
        .terminal-header { background: #1e293b; padding: 10px 15px; font-size: 13px; color: #e2e8f0; font-weight: 600; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;}
        
        .custom-input-area { height: 30%; border-bottom: 2px solid #334155; display: flex; flex-direction: column; }
        .custom-input-area textarea { flex-grow: 1; background: #0f172a; color: #f8fafc; border: none; padding: 10px; outline: none; font-family: monospace; resize: none; font-size: 14px;}
        
        .terminal-output { flex-grow: 1; padding: 15px; font-family: 'Courier New', monospace; font-size: 14px; color: #e2e8f0; overflow-y: auto; white-space: pre-wrap; background: #000;}
        
        .text-success { color: #10b981; } .text-error { color: #ef4444; } .text-warning { color: #f59e0b; } .text-info { color: #3b82f6; }
        .terminal-output pre { background: #1e293b; padding: 10px; border-radius: 5px; border: 1px solid #334155; margin: 10px 0; overflow-x: auto;}
        
        .close-terminal-mobile { display: none; cursor: pointer; color: #cbd5e1; font-size: 18px;}

        /* 🌟 MOBILE RESPONSIVENESS (SMART LAYOUT) 🌟 */
        @media (max-width: 850px) {
            .navbar { padding: 10px 15px; }
            .navbar h2 { font-size: 18px; }
            .mode-btn { padding: 8px 10px; font-size: 12px; }
            .exit-btn span { display: none; } 
            .mobile-menu-btn { display: block; } 

            .web-editors { flex-direction: column; height: auto; flex-grow: 1; overflow-y: auto; }
            .editor-box { min-height: 150px; border-right: none; border-bottom: 2px solid #334155; }
            .web-preview-area { height: 40%; flex-shrink: 0; border-top: 2px solid #3b82f6;}

            .code-workspace { flex-direction: column; }
            
            .file-explorer { position: absolute; left: -250px; height: 100%; box-shadow: 2px 0 10px rgba(0,0,0,0.5); transition: left 0.3s ease-in-out;}
            .file-explorer.active { left: 0; }

            .coding-left { height: 100%; border-right: none; } /* Editor takes full height initially */
            .coding-controls { padding: 10px; gap: 5px; }
            .action-btns .btn-ai span { display: none; } 
            
            /* 🌟 NAYA: Terminal Button visible on Mobile */
            .terminal-btn { display: flex; }

            /* 🌟 NAYA: Terminal Slides up as a Drawer */
            .coding-right { 
                position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; 
                z-index: 50; transform: translateY(100%); transition: transform 0.3s ease-in-out;
                box-shadow: 0 -5px 15px rgba(0,0,0,0.5); border-top: 2px solid #3b82f6;
            }
            .coding-right.active { transform: translateY(0); }
            
            .custom-input-area { height: 40%; }
            .terminal-header { font-size: 12px; padding: 8px 10px; }
            .close-terminal-mobile { display: block; } /* Show close arrow on mobile */
        }
    </style>
</head>
<body>
    
    <div class="navbar">
        <button class="mobile-menu-btn" onclick="toggleFileExplorer()"><i class="fas fa-bars"></i></button>
        <h2><i class="fas fa-laptop-code"></i> Code<span>Master</span></h2>
        
        <div class="mode-toggle">
            <div class="mode-btn active" id="btn-web" onclick="switchMode('web')" title="Web"><i class="fab fa-html5"></i> <span class="hide-mobile">Web</span></div>
            <div class="mode-btn" id="btn-code" onclick="switchMode('code')" title="Pro"><i class="fas fa-terminal"></i> <span class="hide-mobile">Pro</span></div>
        </div>
        <a href="/" class="exit-btn"><i class="fas fa-power-off"></i> <span>Exit</span></a>
    </div>

    <div class="workspace web-workspace" id="webWorkspace">
        <div class="web-editors">
            <div class="editor-box">
                <div class="editor-header" style="color:#ef4444;"><i class="fab fa-html5"></i> HTML</div>
                <textarea id="htmlCode" onkeyup="compileWeb()"></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-header" style="color:#3b82f6;"><i class="fab fa-css3-alt"></i> CSS</div>
                <textarea id="cssCode" onkeyup="compileWeb()"></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-header" style="color:#eab308;"><i class="fab fa-js"></i> JavaScript</div>
                <textarea id="jsCode" onkeyup="compileWeb()"></textarea>
            </div>
        </div>
        <div class="web-preview-area">
            <div class="preview-header"><i class="fas fa-globe"></i> Live Browser Preview</div>
            <iframe id="webOutput"></iframe>
        </div>
    </div>

    <div class="workspace code-workspace hidden" id="codeWorkspace">
        
        <div class="file-explorer" id="mobileExplorer">
            <div class="explorer-header">
                <span>EXPLORER</span>
                <div class="explorer-actions">
                    <i class="fas fa-file-medical" onclick="createNewFile()" title="New File"></i>
                    <label for="fileUpload" title="Upload File"><i class="fas fa-file-upload"></i></label>
                    <input type="file" id="fileUpload" style="display:none;" multiple onchange="uploadFiles(event)">
                    <label for="folderUpload" title="Open Folder"><i class="fas fa-folder-open"></i></label>
                    <input type="file" id="folderUpload" style="display:none;" webkitdirectory directory multiple onchange="uploadFiles(event)">
                </div>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="coding-left">
            <div class="coding-controls">
                <div style="color: #94a3b8; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px;">
                    <i class="fas fa-file-code"></i> <span id="currentFileName">main.py</span>
                </div>
                
                <select id="langSelect" onchange="manualLanguageChange()"></select>
                
                <div class="action-btns">
                    <button class="btn-ai" onclick="askAI('fix')" title="AI Fix Bugs"><i class="fas fa-bug"></i> <span>Fix</span></button>
                    <button class="btn-ai" onclick="askAI('explain')" title="AI Explain"><i class="fas fa-brain"></i> <span>Explain</span></button>
                    <button class="btn-ai" onclick="downloadCurrentFile()" style="color: #eab308; border-color: #eab308;" title="Save / Download"><i class="fas fa-download"></i> <span>Save</span></button>
                </div>

                <div class="run-group">
                    <button class="terminal-btn" onclick="toggleMobileTerminal()"><i class="fas fa-terminal"></i> Input/Out</button>
                    <button class="run-btn" id="runBtn" onclick="executeCode()"><i class="fas fa-play"></i> Run</button>
                </div>
            </div>
            
            <div id="monacoEditor"></div>
        </div>
        
        <div class="coding-right" id="terminalDrawer">
            <div class="custom-input-area">
                <div class="terminal-header" style="background: #0f172a; border-bottom: none;">
                    <span><i class="fas fa-keyboard"></i> Custom Input (stdin)</span>
                    <i class="fas fa-chevron-down close-terminal-mobile" title="Close Terminal" onclick="toggleMobileTerminal()"></i>
                </div>
                <textarea id="customInput" placeholder="If your code needs input (cin, scanf, input()), enter it here before clicking Run..."></textarea>
            </div>
            
            <div class="terminal-header">
                <span><i class="fas fa-terminal"></i> Output</span>
                <i class="fas fa-trash" style="cursor:pointer; color:#ef4444;" title="Clear Output" onclick="document.getElementById('terminalOutput').innerHTML=''"></i>
            </div>
            <div class="terminal-output" id="terminalOutput">
<span class="text-success">CodeMaster Cloud Environment Started...</span>
Ready to execute code.
            </div>
        </div>
    </div>

    <script>
        // 🌟 MOBILE TOGGLES
        function toggleFileExplorer() {
            document.getElementById('mobileExplorer').classList.toggle('active');
        }
        function toggleMobileTerminal() {
            document.getElementById('terminalDrawer').classList.toggle('active');
        }

        // 🌟 1. TOP 20 LANGUAGES DATA (WITH BOILERPLATES) 🌟
        const popularLangs = {
            "python3": { name: "1. Python 3", v: "4", ext: "py", monaco: "python", boiler: "print('Hello CodeMaster! 🚀')" },
            "java": { name: "2. Java", v: "4", ext: "java", monaco: "java", boiler: "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello CodeMaster! 🚀\");\n    }\n}" },
            "cpp17": { name: "3. C++", v: "0", ext: "cpp", monaco: "cpp", boiler: "#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello CodeMaster! 🚀\" << endl;\n    return 0;\n}" },
            "c": { name: "4. C", v: "5", ext: "c", monaco: "c", boiler: "#include <stdio.h>\n\nint main() {\n    printf(\"Hello CodeMaster! 🚀\\n\");\n    return 0;\n}" },
            "nodejs": { name: "5. JavaScript", v: "4", ext: "js", monaco: "javascript", boiler: "console.log('Hello CodeMaster! 🚀');" },
            "csharp": { name: "6. C#", v: "4", ext: "cs", monaco: "csharp", boiler: "using System;\nclass Program {\n  static void Main() {\n    Console.WriteLine(\"Hello CodeMaster! 🚀\");\n  }\n}" },
            "php": { name: "7. PHP", v: "4", ext: "php", monaco: "php", boiler: "<?php\n  echo \"Hello CodeMaster! 🚀\";\n?>" },
            "go": { name: "8. Go", v: "4", ext: "go", monaco: "go", boiler: "package main\nimport \"fmt\"\nfunc main() {\n  fmt.Println(\"Hello CodeMaster! 🚀\")\n}" },
            "ruby": { name: "9. Ruby", v: "4", ext: "rb", monaco: "ruby", boiler: "puts \"Hello CodeMaster! 🚀\"" },
            "rust": { name: "10. Rust", v: "4", ext: "rs", monaco: "rust", boiler: "fn main() {\n  println!(\"Hello CodeMaster! 🚀\");\n}" },
            "swift": { name: "11. Swift", v: "4", ext: "swift", monaco: "swift", boiler: "print(\"Hello CodeMaster! 🚀\")" },
            "kotlin": { name: "12. Kotlin", v: "3", ext: "kt", monaco: "kotlin", boiler: "fun main() {\n  println(\"Hello CodeMaster! 🚀\")\n}" },
            "scala": { name: "13. Scala", v: "4", ext: "scala", monaco: "scala", boiler: "object Main {\n  def main(args: Array[String]): Unit = {\n    println(\"Hello CodeMaster! 🚀\")\n  }\n}" },
            "dart": { name: "14. Dart", v: "4", ext: "dart", monaco: "dart", boiler: "void main() {\n  print('Hello CodeMaster! 🚀');\n}" },
            "r": { name: "15. R", v: "4", ext: "r", monaco: "r", boiler: "print(\"Hello CodeMaster! 🚀\")" },
            "sql": { name: "16. SQL", v: "4", ext: "sql", monaco: "sql", boiler: "CREATE TABLE hello (message TEXT);\nINSERT INTO hello VALUES ('Hello CodeMaster! 🚀');\nSELECT * FROM hello;" },
            "bash": { name: "17. Bash", v: "4", ext: "sh", monaco: "shell", boiler: "echo \"Hello CodeMaster! 🚀\"" },
            "perl": { name: "18. Perl", v: "4", ext: "pl", monaco: "perl", boiler: "print \"Hello CodeMaster! 🚀\\n\";" },
            "lua": { name: "19. Lua", v: "3", ext: "lua", monaco: "lua", boiler: "print(\"Hello CodeMaster! 🚀\")" },
            "haskell": { name: "20. Haskell", v: "4", ext: "hs", monaco: "plaintext", boiler: "main = putStrLn \"Hello CodeMaster! 🚀\"" }
        };

        const extraLangsData = [
            ['ada', 'Ada', '4', 'ada', 'ada'], ['awk', 'AWK', '4', 'awk', 'plaintext'], ['cobol', 'COBOL', '3', 'cob', 'cobol'], 
            ['elixir', 'Elixir', '4', 'ex', 'elixir'], ['erlang', 'Erlang', '0', 'erl', 'plaintext'], ['fsharp', 'F#', '2', 'fs', 'fsharp'], 
            ['julia', 'Julia', '4', 'jl', 'julia'], ['objective-c', 'Objective-C', '4', 'm', 'objective-c'], ['pascal', 'Pascal', '3', 'pas', 'pascal']
        ];

        const otherLangs = {};
        extraLangsData.forEach(l => { 
            otherLangs[l[0]] = { name: "📄 " + l[1], v: l[2], ext: l[3], monaco: l[4], boiler: `// Write your ${l[1]} code here...\n` }; 
        });

        const allLangs = { ...popularLangs, ...otherLangs };

        // 🌟 2. VIRTUAL FILE SYSTEM LOGIC
        let fileSystem = JSON.parse(localStorage.getItem('cm_filesystem')) || {
            "main.py": { code: popularLangs['python3'].boiler, lang: "python3" }
        };
        let activeFile = Object.keys(fileSystem)[0] || "main.py";
        let editorInstance;

        // Initialize Monaco
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editorInstance = monaco.editor.create(document.getElementById('monacoEditor'), {
                value: fileSystem[activeFile].code,
                language: popularLangs[fileSystem[activeFile].lang].monaco,
                theme: 'vs-dark',
                automaticLayout: true, fontSize: 14, minimap: { enabled: false }
            });

            editorInstance.onDidChangeModelContent(() => {
                fileSystem[activeFile].code = editorInstance.getValue();
                localStorage.setItem('cm_filesystem', JSON.stringify(fileSystem));
            });
            
            renderFileList();
            updateDropdownUI();
        });

        function updateDropdownUI() {
            const select = document.getElementById('langSelect');
            let selectHTML = `<optgroup label="🔥 Top 20 Languages">`;
            for(let key in popularLangs) { selectHTML += `<option value="${key}">${popularLangs[key].name}</option>`; }
            selectHTML += `</optgroup><optgroup label="Other Languages">`;
            for(let key in otherLangs) { selectHTML += `<option value="${key}">${otherLangs[key].name}</option>`; }
            selectHTML += `</optgroup>`;
            select.innerHTML = selectHTML;
            select.value = fileSystem[activeFile].lang;
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('htmlCode').value = `<h1>Hello Web Developer!</h1>`;
            document.getElementById('cssCode').value = `h1 { color: #3b82f6; text-align: center; margin-top: 50px; font-family: sans-serif;}`;
            compileWeb(); 
        });

        function switchMode(mode) {
            document.getElementById('btn-web').classList.remove('active');
            document.getElementById('btn-code').classList.remove('active');
            document.getElementById(`btn-${mode}`).classList.add('active');

            if (mode === 'web') {
                document.getElementById('codeWorkspace').classList.add('hidden');
                document.getElementById('webWorkspace').classList.remove('hidden');
                document.querySelector('.mobile-menu-btn').style.display = 'none';
            } else {
                document.getElementById('webWorkspace').classList.add('hidden');
                document.getElementById('codeWorkspace').classList.remove('hidden');
                if(window.innerWidth <= 850) document.querySelector('.mobile-menu-btn').style.display = 'block';
            }
        }

        function compileWeb() {
            const html = document.getElementById('htmlCode').value;
            const css = `<style>${document.getElementById('cssCode').value}</style>`;
            const js = "<scr" + "ipt>" + document.getElementById('jsCode').value + "</scr" + "ipt>";
            document.getElementById('webOutput').srcdoc = html + css + js;
        }

        // 🌟 3. FILE EXPLORER FUNCTIONS
        function renderFileList() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            for (let filename in fileSystem) {
                let icon = 'fa-file-code';
                if(filename.endsWith('.py')) icon = 'fa-python';
                else if(filename.endsWith('.js')) icon = 'fa-js';
                else if(filename.endsWith('.java')) icon = 'fa-java';
                else if(filename.endsWith('.cpp') || filename.endsWith('.c')) icon = 'fa-cuttlefish';
                
                list.innerHTML += `
                    <div class="file-item ${filename === activeFile ? 'active' : ''}" onclick="switchFile('${filename}')">
                        <i class="fab ${icon} text-info"></i> ${filename}
                        <i class="fas fa-times" style="margin-left:auto; color:#ef4444; font-size:12px;" onclick="deleteFile(event, '${filename}')"></i>
                    </div>
                `;
            }
            document.getElementById('currentFileName').innerText = activeFile;
        }

        function switchFile(filename) {
            activeFile = filename;
            const fileData = fileSystem[filename];
            monaco.editor.setModelLanguage(editorInstance.getModel(), allLangs[fileData.lang].monaco);
            editorInstance.setValue(fileData.code);
            document.getElementById('langSelect').value = fileData.lang;
            renderFileList();
            document.getElementById('mobileExplorer').classList.remove('active');
        }

        function createNewFile() {
            let filename = prompt("Enter new file name (e.g. script.py):");
            if(!filename) return;
            filename = filename.trim();
            if(fileSystem[filename]) return alert("File already exists!");

            let detectedLang = "python3";
            for(let key in allLangs) {
                if(filename.endsWith("." + allLangs[key].ext)) { detectedLang = key; break; }
            }

            fileSystem[filename] = { code: allLangs[detectedLang].boiler, lang: detectedLang };
            localStorage.setItem('cm_filesystem', JSON.stringify(fileSystem));
            switchFile(filename);
        }

        function deleteFile(e, filename) {
            e.stopPropagation();
            if(Object.keys(fileSystem).length === 1) return alert("Cannot delete the last file!");
            if(confirm(`Delete ${filename}?`)) {
                delete fileSystem[filename];
                if(activeFile === filename) activeFile = Object.keys(fileSystem)[0];
                localStorage.setItem('cm_filesystem', JSON.stringify(fileSystem));
                switchFile(activeFile);
            }
        }

        function uploadFiles(event) {
            const files = event.target.files;
            if(!files || files.length === 0) return;

            let fileLoadedCount = 0;

            for(let i=0; i<files.length; i++) {
                const file = files[i];
                const filename = file.name;
                
                let detectedLang = "python3";
                for(let key in allLangs) {
                    if(filename.endsWith("." + allLangs[key].ext)) { detectedLang = key; break; }
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    fileSystem[filename] = { code: e.target.result, lang: detectedLang };
                    fileLoadedCount++;
                    
                    if(fileLoadedCount === 1) switchFile(filename);
                    if(fileLoadedCount === files.length) {
                        localStorage.setItem('cm_filesystem', JSON.stringify(fileSystem));
                        renderFileList();
                    }
                };
                reader.readAsText(file);
            }
            event.target.value = "";
        }

        function manualLanguageChange() {
            const langCode = document.getElementById('langSelect').value;
            fileSystem[activeFile].lang = langCode;
            monaco.editor.setModelLanguage(editorInstance.getModel(), allLangs[langCode].monaco);
            
            // Set Boilerplate if file is empty
            if(editorInstance.getValue().trim() === "") {
                editorInstance.setValue(allLangs[langCode].boiler);
            }
            
            localStorage.setItem('cm_filesystem', JSON.stringify(fileSystem));
        }

        function downloadCurrentFile() {
            const code = editorInstance.getValue();
            if(!code.trim()) return;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = activeFile; a.click();
            window.URL.revokeObjectURL(url);
        }

        // 🌟 5. EXECUTION LOGIC
        async function executeCode() {
            const langCode = document.getElementById('langSelect').value;
            const code = editorInstance.getValue();
            const customInput = document.getElementById('customInput').value; 
            const version = allLangs[langCode].v;
            
            const terminal = document.getElementById('terminalOutput');
            const runBtn = document.getElementById('runBtn');

            if (!code.trim()) return terminal.innerHTML = `<span class="text-error">Error: Code is empty!</span>`;

            // 🌟 Mobile auto-open terminal on Run
            if(window.innerWidth <= 850) {
                document.getElementById('terminalDrawer').classList.add('active');
            }

            runBtn.disabled = true; runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            terminal.innerHTML = `<span class="text-warning">➜ Executing on CodeMaster Cloud Engine...</span>\n`;

            try {
                const response = await fetch('/api/compile-code', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ script: code, language: langCode, versionIndex: version, stdin: customInput })
                });
                const data = await response.json();
                
                if (data.error) terminal.innerHTML += `<span class="text-error">Server Error: ${data.error}</span>`;
                else if (data.statusCode !== 200) terminal.innerHTML += `<span class="text-error">Compilation Error:\n${data.output}</span>`;
                else terminal.innerHTML += `<span class="text-success">Output:</span>\n${data.output}\n<span class="text-info">Memory: ${data.memory} KB | CPU: ${data.cpuTime} Sec</span>`;
            } catch (error) { terminal.innerHTML = `<span class="text-error">Connection Failed!</span>`; }
            
            runBtn.disabled = false; runBtn.innerHTML = '<i class="fas fa-play"></i> Run';
        }

        // 🌟 6. AI LOGIC
        async function askAI(action) {
            const code = editorInstance.getValue();
            const terminal = document.getElementById('terminalOutput');
            
            if(!code.trim()) return alert("Please write some code first!");
            
            if(window.innerWidth <= 850) {
                document.getElementById('terminalDrawer').classList.add('active');
            }

            terminal.innerHTML = `<span class="text-info"><i class="fas fa-brain fa-spin"></i> CodeMaster AI is analyzing...</span>\n`;

            let prompt = action === 'fix' 
                ? `Act as an expert programmer. Find bugs in this code, explain them shortly, and provide the fixed code:\n\n${code}` 
                : `Explain what this code does line by line in simple terms (Hindi/English mix):\n\n${code}`;

            try {
                const res = await fetch('/api/ask-ai', { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: prompt }) 
                });
                const data = await res.json();
                
                if(data.success) {
                    const formattedReply = typeof marked !== 'undefined' ? marked.parse(data.reply) : data.reply;
                    terminal.innerHTML = `<span class="text-success">🤖 CodeMaster AI Mentor:</span><div style="background: #1e293b; padding: 15px; border-radius: 8px; margin-top: 10px;">${formattedReply}</div>`;
                } else { terminal.innerHTML = `<span class="text-error">AI Error: ${data.reply}</span>`; }
            } catch(e) { terminal.innerHTML = `<span class="text-error">⚠️ AI Network Error!</span>`; }
        }
    </script>
</body>
</html>

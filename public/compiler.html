<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Code Compiler - CodeMaster</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .compiler-section {
            padding: 100px 5% 40px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .compiler-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .compiler-header h2 { font-size: 30px; color: var(--text-main); }
        .compiler-header span { color: var(--primary-color); }
        .compiler-header p { color: var(--text-muted); font-size: 14px; }
        
        .compiler-container {
            flex-grow: 1;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            background: var(--surface-color);
        }
        
        /* IFRAME ko full size dene ke liye */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    
<a href="/" class="back-to-home-btn">
    <i class='bx bx-home-alt'></i> Back to Home
</a>

    <header class="header">
        <a href="/" class="logo"><i class='bx bx-code-block'></i> Code<span>Master</span></a>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/courses">Courses</a></li>
                <li><a href="/compiler.html" class="active">Compiler</a></li>
            </ul>
        </nav>
        <div class="auth-container" id="auth-buttons">
            <a href="/login" class="btn-login">Login</a>
            <a href="/signup" class="btn-signup">Sign Up Free</a>
        </div>
        <div class="bx bx-menu" id="menu-icon"></div>
    </header>

    <section class="compiler-section">
        <div class="compiler-header">
            <h2>CodeMaster <span>Live IDE</span></h2>
            <p>Run C, C++, Java, Python, JS, and 50+ other languages instantly right from your browser.</p>
        </div>
        
        <div class="compiler-container">
            <iframe src="https://onecompiler.com/embed/?theme=dark&hideLanguageSelection=false&hideNew=true&hideTitle=true" 
                    title="Live Code Compiler"></iframe>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Compiler - CodeMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Navbar */
        .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .navbar h2 { color: #3b82f6; font-weight: 600; font-size: 22px; }
        .navbar h2 span { color: #f8fafc; }
        
        .controls { display: flex; gap: 15px; align-items: center; }
        select { background: #0f172a; color: white; border: 1px solid #3b82f6; padding: 8px 15px; border-radius: 5px; outline: none; font-size: 14px; cursor: pointer; }
        .run-btn { background: #10b981; color: white; border: none; padding: 8px 25px; border-radius: 5px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .run-btn:hover { background: #059669; }
        
        /* Workspace */
        .workspace { display: flex; flex-grow: 1; height: calc(100vh - 65px); }
        
        /* Editor Area */
        .editor-container { width: 60%; display: flex; flex-direction: column; border-right: 2px solid #334155; }
        .tab-header { background: #1e293b; padding: 10px 20px; font-size: 14px; color: #94a3b8; font-weight: 500; border-bottom: 1px solid #334155; }
        textarea.editor { flex-grow: 1; background: #1e293b; color: #f8fafc; font-family: 'Courier New', Courier, monospace; font-size: 16px; padding: 20px; border: none; outline: none; resize: none; line-height: 1.5; }
        
        /* Output Area */
        .output-container { width: 40%; display: flex; flex-direction: column; background: #0f172a; }
        .output-box { flex-grow: 1; padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 15px; overflow-y: auto; color: #e2e8f0; white-space: pre-wrap; }
        .error-text { color: #ef4444; }
        .success-text { color: #10b981; }
        
        /* Loading Animation */
        .loader { display: none; margin-left: 10px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid white; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>Code<span>Master</span> IDE</h2>
        <div class="controls">
            <select id="languageSelect" onchange="changeLanguage()">
                <option value="python">Python 3</option>
                <option value="javascript">Node.js (JavaScript)</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
            </select>
            <button class="run-btn" onclick="executeCode()" id="runBtn">
                <i class="fas fa-play"></i> Run Code <div class="loader" id="loader"></div>
            </button>
            <a href="/dashboard.html" style="color: #94a3b8; text-decoration: none; margin-left: 10px;"><i class="fas fa-times" style="font-size: 20px;"></i></a>
        </div>
    </div>

    <div class="workspace">
        <div class="editor-container">
            <div class="tab-header"><i class="fas fa-code"></i> <span id="fileName">main.py</span></div>
            <textarea id="sourceCode" class="editor" spellcheck="false"></textarea>
        </div>
        
        <div class="output-container">
            <div class="tab-header"><i class="fas fa-terminal"></i> Terminal Output</div>
            <div id="outputBox" class="output-box">Output will appear here...</div>
        </div>
    </div>

    <script>
        // Default templates for different languages
        const boilerplate = {
            python: "print('Hello, CodeMaster!')\n\n# Write your Python code here\n",
            javascript: "console.log('Hello, CodeMaster!');\n\n// Write your JavaScript code here\n",
            java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, CodeMaster!");\n    }\n}',
            cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, CodeMaster!" << endl;\n    return 0;\n}',
            c: '#include <stdio.h>\n\nint main() {\n    printf("Hello, CodeMaster!\\n");\n    return 0;\n}'
        };

        const fileExtensions = { python: "main.py", javascript: "index.js", java: "Main.java", cpp: "main.cpp", c: "main.c" };

        // Piston API needs specific version numbers for languages
        const languageVersions = {
            python: "3.10.0",
            javascript: "18.15.0",
            java: "15.0.2",
            cpp: "10.2.0",
            c: "10.2.0"
        };

        // On Page Load
        window.onload = () => {
            changeLanguage();
        };

        // Change Language & Update Boilerplate
        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            document.getElementById('sourceCode').value = boilerplate[lang];
            document.getElementById('fileName').innerText = fileExtensions[lang];
            document.getElementById('outputBox').innerHTML = "Ready to compile " + lang + "...";
            document.getElementById('outputBox').className = "output-box";
        }

        // Execution Logic using Piston API
        async function executeCode() {
            const lang = document.getElementById('languageSelect').value;
            const code = document.getElementById('sourceCode').value;
            const outputBox = document.getElementById('outputBox');
            const runBtn = document.getElementById('runBtn');
            const loader = document.getElementById('loader');

            if (!code.trim()) {
                outputBox.innerHTML = "<span class='error-text'>Error: Please write some code before running.</span>";
                return;
            }

            // UI Changes while loading
            runBtn.disabled = true;
            loader.style.display = "inline-block";
            outputBox.innerHTML = "Executing on cloud server...\n";
            outputBox.className = "output-box";

            // Prepare Data for API
            const payload = {
                language: lang,
                version: languageVersions[lang],
                files: [{ content: code }]
            };

            try {
                // Sending code to Piston API Engine
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.message) {
                    // API Level Error (e.g., Rate limit)
                    outputBox.innerHTML = `<span class='error-text'>Server Error: ${data.message}</span>`;
                } else if (data.run.stderr) {
                    // Syntax Error in Student's Code
                    outputBox.innerHTML = `<span class='error-text'>${data.run.stderr}</span>`;
                } else {
                    // Successful Execution
                    outputBox.innerHTML = `<span class='success-text'>Program Exited Successfully.</span>\n\n${data.run.stdout}`;
                }
            } catch (error) {
                outputBox.innerHTML = "<span class='error-text'>Failed to connect to execution server. Check your internet.</span>";
            }

            // Reset UI
            runBtn.disabled = false;
            loader.style.display = "none";
        }
    </script>
</body>
</html>

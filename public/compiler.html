<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Master IDE - CodeMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Navbar */
        .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .navbar h2 { color: #3b82f6; font-weight: 600; font-size: 22px; display: flex; align-items: center; gap: 10px;}
        .navbar h2 span { color: #f8fafc; }
        
        /* Custom Tabs for 3 Modes */
        .mode-tabs { display: flex; gap: 10px; background: #0f172a; padding: 5px; border-radius: 8px; border: 1px solid #334155;}
        .mode-tab { padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.3s; color: #94a3b8; }
        .mode-tab.active { background: #3b82f6; color: white; }
        
        .controls { display: flex; gap: 15px; align-items: center; }
        select { background: #0f172a; color: #10b981; border: 1px solid #3b82f6; padding: 8px 15px; border-radius: 5px; outline: none; font-size: 14px; cursor: pointer; font-weight: 500; max-width: 200px;}
        
        .run-btn { background: #10b981; color: white; border: none; padding: 8px 25px; border-radius: 5px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .run-btn:hover { background: #059669; }
        
        /* Workspaces */
        .workspace { display: flex; flex-grow: 1; height: calc(100vh - 65px); transition: 0.3s; }
        .hidden { display: none !important; }
        
        /* 1 & 2. Standard Editor Area */
        .editor-container { width: 50%; display: flex; flex-direction: column; border-right: 2px solid #334155; }
        .tab-header { background: #1e293b; padding: 10px 20px; font-size: 14px; color: #94a3b8; font-weight: 500; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;}
        textarea.editor { flex-grow: 1; background: #0f172a; color: #f8fafc; font-family: 'Courier New', Courier, monospace; font-size: 16px; padding: 20px; border: none; outline: none; resize: none; line-height: 1.6; }
        
        .output-container { width: 50%; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .terminal-box { flex-grow: 1; padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 15px; overflow-y: auto; color: #e2e8f0; white-space: pre-wrap; background: #000; border-left: 1px solid #334155;}
        .web-frame { flex-grow: 1; width: 100%; height: 100%; border: none; background: white; }
        .error-text { color: #ef4444; font-weight: bold;}
        .success-text { color: #10b981; font-weight: bold;}
        
        /* 3. Full Stack Workspace Area (StackBlitz) */
        .fullstack-workspace { width: 100%; height: 100%; border: none; }
        
        .loader { display: none; margin-left: 5px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid white; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="navbar">
        <h2><i class="fas fa-code-branch"></i> Code<span>Master</span></h2>
        
        <div class="mode-tabs">
            <div class="mode-tab active" onclick="switchMode('basic')"><i class="fas fa-bolt"></i> Fast Compiler (70+ Langs)</div>
            <div class="mode-tab" onclick="switchMode('web')"><i class="fas fa-globe"></i> HTML/JS Preview</div>
            <div class="mode-tab" onclick="switchMode('fullstack')" style="color: #fbbf24;"><i class="fas fa-box-open"></i> Full Workspace (Modules)</div>
        </div>

        <div class="controls" id="basicControls">
            <select id="languageSelect" onchange="changeLanguage()">
                <option disabled>⏳ Loading 70+ Languages...</option>
            </select>
            <button class="run-btn" onclick="executeCode()" id="runBtn"><i class="fas fa-play"></i> Run <div class="loader" id="loader"></div></button>
        </div>
        
        <a href="/dashboard.html" style="color: #ef4444; text-decoration: none; margin-left: 15px; font-weight: 600; border: 1px solid #ef4444; padding: 6px 15px; border-radius: 5px;"><i class="fas fa-sign-out-alt"></i> Exit</a>
    </div>

    <div class="workspace" id="standardWorkspace">
        <div class="editor-container">
            <div class="tab-header">
                <span><i class="fas fa-code"></i> <span id="fileName" style="color:#10b981;">main.py</span></span>
            </div>
            <textarea id="sourceCode" class="editor" spellcheck="false"></textarea>
        </div>
        
        <div class="output-container">
            <div class="tab-header"><i class="fas fa-tv"></i> <span id="outputTitle">Terminal Output</span></div>
            <div id="terminalBox" class="terminal-box">Output will appear here...</div>
            <iframe id="webFrame" class="web-frame hidden"></iframe>
        </div>
    </div>

    <div class="workspace hidden" id="fullstackWorkspace">
        <iframe class="fullstack-workspace" src="https://stackblitz.com/edit/node-express-starter?embed=1&file=index.js&terminalHeight=40&showSidebar=1" id="stackblitzFrame"></iframe>
    </div>

    <script>
        let languageVersions = {};
        const boilerplates = {
            web: `<!DOCTYPE html>\n<html>\n<head>\n  <style>\n    body { font-family: 'Arial'; text-align: center; margin-top: 50px; background: #f0f4f8; }\n    h1 { color: #3b82f6; }\n  </style>\n</head>\n<body>\n  <h1>Hello, CodeMaster! 🚀</h1>\n</body>\n</html>`,
            python: "print('Hello, CodeMaster Universe! 🚀')\n",
            java: 'public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, Java Master! ☕");\n    }\n}',
            cpp: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, C++ Ninja! ⚙️" << endl;\n    return 0;\n}'
        };

        // UI Mode Switcher
        function switchMode(mode) {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const stdWorkspace = document.getElementById('standardWorkspace');
            const fsWorkspace = document.getElementById('fullstackWorkspace');
            const basicControls = document.getElementById('basicControls');
            const termBox = document.getElementById('terminalBox');
            const webFrame = document.getElementById('webFrame');

            if(mode === 'basic') {
                stdWorkspace.classList.remove('hidden');
                fsWorkspace.classList.add('hidden');
                basicControls.classList.remove('hidden');
                termBox.classList.remove('hidden');
                webFrame.classList.add('hidden');
                changeLanguage(); // Reset to selected lang
            } 
            else if(mode === 'web') {
                stdWorkspace.classList.remove('hidden');
                fsWorkspace.classList.add('hidden');
                basicControls.classList.add('hidden'); // Hide run button
                termBox.classList.add('hidden');
                webFrame.classList.remove('hidden');
                document.getElementById('fileName').innerText = "index.html";
                document.getElementById('outputTitle').innerText = "Live Website Preview";
                document.getElementById('sourceCode').value = boilerplates.web;
                runWebCode();
                
                // Add event listener to auto-run HTML on type
                document.getElementById('sourceCode').onkeyup = runWebCode;
            }
            else if(mode === 'fullstack') {
                stdWorkspace.classList.add('hidden');
                fsWorkspace.classList.remove('hidden');
                basicControls.classList.add('hidden');
                // StackBlitz handles everything automatically!
            }
        }

        function runWebCode() {
            document.getElementById('webFrame').srcdoc = document.getElementById('sourceCode').value;
        }

        // Fetch 70+ Languages on Load
        window.onload = async () => {
            try {
                const res = await fetch('https://emkc.org/api/v2/piston/runtimes');
                const runtimes = await res.json();
                const select = document.getElementById('languageSelect');
                select.innerHTML = '';
                
                runtimes.forEach(rt => languageVersions[rt.language] = rt.version);
                Object.keys(languageVersions).sort().forEach(lang => {
                    const opt = document.createElement('option');
                    opt.value = lang;
                    opt.innerText = `${lang.toUpperCase()} (v${languageVersions[lang]})`;
                    if(lang === 'python') opt.selected = true;
                    select.appendChild(opt);
                });
                changeLanguage();
            } catch(e) {
                document.getElementById('languageSelect').innerHTML = '<option disabled>Failed to load.</option>';
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('languageSelect').value;
            document.getElementById('fileName').innerText = `main.${lang}`;
            document.getElementById('outputTitle').innerText = "Terminal Output";
            document.getElementById('sourceCode').value = boilerplates[lang] || `// Write your ${lang.toUpperCase()} code here\n`;
            document.getElementById('terminalBox').innerHTML = "Ready to compile. Click Run.";
            document.getElementById('sourceCode').onkeyup = null; // Remove auto-run
        }

        async function executeCode() {
            const lang = document.getElementById('languageSelect').value;
            const code = document.getElementById('sourceCode').value;
            const terminalBox = document.getElementById('terminalBox');
            const runBtn = document.getElementById('runBtn');
            const loader = document.getElementById('loader');

            runBtn.disabled = true;
            loader.style.display = "inline-block";
            terminalBox.innerHTML = "Executing...\n";

            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: lang, version: languageVersions[lang], files: [{ content: code }] })
                });
                const data = await response.json();
                if (data.run.stderr) terminalBox.innerHTML = `<span class='error-text'>${data.run.stderr}</span>`;
                else terminalBox.innerHTML = `<span class='success-text'>Success:</span>\n\n${data.run.stdout}`;
            } catch (error) {
                terminalBox.innerHTML = "<span class='error-text'>Connection Failed.</span>";
            }
            runBtn.disabled = false;
            loader.style.display = "none";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate IDE - CodeMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .navbar { background: #1e293b; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .navbar h2 { color: #3b82f6; font-size: 20px; display: flex; align-items: center; gap: 10px;}
        
        .mode-tabs { display: flex; gap: 10px; background: #0f172a; padding: 5px; border-radius: 8px; border: 1px solid #334155;}
        .mode-tab { padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.3s; color: #94a3b8; }
        .mode-tab.active { background: #3b82f6; color: white; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        .btn { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #059669; }
        select { background: #0f172a; color: #10b981; border: 1px solid #3b82f6; padding: 8px; border-radius: 5px; outline: none; font-weight: bold;}

        .workspace { display: flex; flex-grow: 1; height: calc(100vh - 60px); }
        .hidden { display: none !important; }

        /* WEB WORKSPACE */
        .web-workspace { flex-direction: column; width: 100%; height: 100%; }
        .editors-grid { display: flex; height: 50%; border-bottom: 2px solid #334155; }
        .editor-box { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        .editor-header { background: #1e293b; padding: 5px 15px; font-size: 13px; font-weight: bold; color: #94a3b8; border-bottom: 1px solid #334155; }
        .editor-box textarea { flex-grow: 1; background: #0f172a; color: #e2e8f0; font-family: monospace; padding: 15px; border: none; outline: none; resize: none; }
        .web-output { height: 50%; background: white; width: 100%; border: none; }

        /* BACKEND WORKSPACE */
        .sidebar { width: 220px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #334155; font-size: 14px; color: #94a3b8; font-weight: bold;}
        .file-list { list-style: none; overflow-y: auto; flex-grow: 1; }
        .file-item { padding: 10px 15px; font-size: 14px; cursor: pointer; color: #cbd5e1; border-bottom: 1px solid #0f172a; display: flex; justify-content: space-between; align-items: center;}
        .file-item:hover, .file-item.active { background: #3b82f6; color: white; }
        .add-file-btn { width: 100%; padding: 15px; background: #0f172a; color: #10b981; border: none; cursor: pointer; font-weight: bold; border-top: 1px solid #334155; }
        .add-file-btn:hover { background: #10b981; color: white;}
        
        .backend-editor-area { flex-grow: 1; display: flex; flex-direction: column; width: calc(100% - 220px); }
        .code-area { flex-grow: 1; display: flex; flex-direction: column; height: 60%; border-bottom: 2px solid #334155;}
        .code-area textarea { flex-grow: 1; background: #0f172a; color: #f8fafc; font-family: monospace; padding: 20px; border: none; outline: none; font-size: 15px; resize: none; }
        .terminal-area { height: 40%; background: #000; color: #e2e8f0; font-family: monospace; padding: 15px; overflow-y: auto; white-space: pre-wrap; }

        /* MODULES WORKSPACE */
        .sandbox-frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <h2><i class="fas fa-code"></i> Code<span>Master</span></h2>
        
        <div class="mode-tabs">
            <div class="mode-tab active" onclick="switchMode('web')" id="tab-web"><i class="fab fa-html5"></i> Web Preview</div>
            <div class="mode-tab" onclick="switchMode('backend')" id="tab-backend"><i class="fas fa-folder"></i> Backend (Multi-File)</div>
            <div class="mode-tab" onclick="switchMode('modules')" id="tab-modules" style="color: #fbbf24;"><i class="fab fa-node-js"></i> Full Workspace</div>
        </div>

        <div class="controls">
            <div id="backendControls" class="hidden" style="display: flex; gap: 10px;">
                <select id="langSelect" onchange="initBackend()"><option value="python">PYTHON (v3.10.0)</option></select>
                <button class="btn" onclick="runBackendCode()"><i class="fas fa-play"></i> Run Code</button>
            </div>
            <a href="/dashboard.html" style="color: #ef4444; font-weight: bold; text-decoration: none; padding-left: 10px;"><i class="fas fa-sign-out-alt"></i> Exit</a>
        </div>
    </div>

    <div class="workspace web-workspace" id="webWorkspace">
        <div class="editors-grid">
            <div class="editor-box">
                <div class="editor-header"><i class="fab fa-html5" style="color:#ef4444;"></i> HTML</div>
                <textarea id="htmlBox" onkeyup="runWeb()"></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-header"><i class="fab fa-css3-alt" style="color:#3b82f6;"></i> CSS</div>
                <textarea id="cssBox" onkeyup="runWeb()"></textarea>
            </div>
            <div class="editor-box" style="border-right: none;">
                <div class="editor-header"><i class="fab fa-js" style="color:#eab308;"></i> JS</div>
                <textarea id="jsBox" onkeyup="runWeb()"></textarea>
            </div>
        </div>
        <iframe id="webOutput" class="web-output"></iframe>
    </div>

    <div class="workspace hidden" id="backendWorkspace">
        <div class="sidebar">
            <div class="sidebar-header">FILE EXPLORER</div>
            <ul class="file-list" id="fileList"></ul>
            <button class="add-file-btn" onclick="createNewFile()"><i class="fas fa-plus"></i> New File</button>
        </div>
        <div class="backend-editor-area">
            <div class="code-area">
                <div class="editor-header" id="currentFileName" style="color: #10b981; font-weight: bold;">main.py</div>
                <textarea id="backendEditor" onkeyup="saveCurrentFile()"></textarea>
            </div>
            <div class="terminal-area" id="terminalBox">➜ Terminal Ready. Click 'Run Code' to execute.</div>
        </div>
    </div>

    <div class="workspace hidden" id="modulesWorkspace">
        <iframe class="sandbox-frame" src="https://codesandbox.io/embed/vanilla-node?fontsize=14&hidenavigation=1&theme=dark"></iframe>
    </div>

    <script>
        // Use DOMContentLoaded to ensure HTML is fully loaded before JS runs
        document.addEventListener("DOMContentLoaded", () => {
            
            // 1. SAFELY SET WEB CODE (Prevents HTML parsing crashes)
            document.getElementById('htmlBox').value = `<div class="box">\n  <h1>Hello CodeMaster!</h1>\n  <p>Web Compiler is Live.</p>\n</div>`;
            document.getElementById('cssBox').value = `body { display: flex; justify-content: center; margin-top: 50px; background: #f0f4f8; font-family: sans-serif; }\n.box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }\nh1 { color: #3b82f6; }`;
            document.getElementById('jsBox').value = `console.log("Web Engine Started!");`;
            
            // 2. INITIALIZE MODES AND LANGUAGES
            runWeb();
            fetchLangsFromCloud();
        });

        // ==========================================
        // UI SWITCHING LOGIC
        // ==========================================
        function switchMode(mode) {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');

            document.getElementById('webWorkspace').classList.add('hidden');
            document.getElementById('backendWorkspace').classList.add('hidden');
            document.getElementById('modulesWorkspace').classList.add('hidden');
            document.getElementById('backendControls').classList.add('hidden');

            if (mode === 'web') {
                document.getElementById('webWorkspace').classList.remove('hidden');
                runWeb();
            } else if (mode === 'backend') {
                document.getElementById('backendWorkspace').classList.remove('hidden');
                document.getElementById('backendControls').classList.remove('hidden');
                if (Object.keys(backendFiles).length === 0) initBackend();
            } else if (mode === 'modules') {
                document.getElementById('modulesWorkspace').classList.remove('hidden');
            }
        }

        // ==========================================
        // WEB ENGINE LOGIC
        // ==========================================
        function runWeb() {
            try {
                const html = document.getElementById('htmlBox').value;
                const css = `<style>${document.getElementById('cssBox').value}</style>`;
                // Safely create script tag to avoid escaping issues
                const js = "<scr" + "ipt>" + document.getElementById('jsBox').value + "</scr" + "ipt>";
                document.getElementById('webOutput').srcdoc = html + css + js;
            } catch (err) {
                console.error("Web Engine Error:", err);
            }
        }

        // ==========================================
        // BACKEND ENGINE LOGIC
        // ==========================================
        let backendFiles = {};
        let activeFile = "";
        let globalVersions = {
            "python": "3.10.0", "javascript": "18.15.0", "java": "15.0.2", "cpp": "10.2.0", "c": "10.2.0"
        }; // Fallback default languages

        async function fetchLangsFromCloud() {
            try {
                const res = await fetch('https://emkc.org/api/v2/piston/runtimes');
                const data = await res.json();
                
                const select = document.getElementById('langSelect');
                select.innerHTML = ''; // Clear defaults
                
                // Sort and populate all 70+ languages
                let tempLangs = [];
                data.forEach(rt => {
                    globalVersions[rt.language] = rt.version;
                    tempLangs.push(rt.language);
                });
                
                tempLangs.sort().forEach(lang => {
                    select.innerHTML += `<option value="${lang}">${lang.toUpperCase()} (v${globalVersions[lang]})</option>`;
                });
                
                select.value = 'python'; // Set default selection
            } catch (error) {
                console.log("Cloud fetch failed, using fallback languages.");
            }
        }

        function initBackend() {
            const lang = document.getElementById('langSelect').value;
            backendFiles = {}; 
            
            if (lang === 'python') {
                backendFiles['main.py'] = "import helper\n\nprint('Hello from Main.py!')\nhelper.greet()";
                backendFiles['helper.py'] = "def greet():\n    print('CodeMaster Modules are working!')";
                activeFile = 'main.py';
            } else if (lang === 'javascript') {
                backendFiles['index.js'] = "const math = require('./math.js');\nconsole.log('Math logic: 5 + 5 =', math.add(5, 5));";
                backendFiles['math.js'] = "module.exports.add = (a, b) => a + b;";
                activeFile = 'index.js';
            } else {
                backendFiles[`main.${lang}`] = `// Start your ${lang.toUpperCase()} code here\n`;
                activeFile = `main.${lang}`;
            }
            refreshSidebar();
            openFile(activeFile);
        }

        function refreshSidebar() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            for (let fileName in backendFiles) {
                const isActive = fileName === activeFile ? 'active' : '';
                list.innerHTML += `
                    <li class="file-item ${isActive}" onclick="openFile('${fileName}')">
                        <span><i class="fas fa-file-code"></i> ${fileName}</span>
                        ${Object.keys(backendFiles).length > 1 ? `<i class="fas fa-trash-alt" style="color:#ef4444;" onclick="removeFile(event, '${fileName}')"></i>` : ''}
                    </li>
                `;
            }
        }

        function openFile(fileName) {
            activeFile = fileName;
            document.getElementById('currentFileName').innerText = fileName;
            document.getElementById('backendEditor').value = backendFiles[fileName];
            refreshSidebar();
        }

        function saveCurrentFile() {
            backendFiles[activeFile] = document.getElementById('backendEditor').value;
        }

        function createNewFile() {
            const name = prompt("Enter new file name (e.g., config.json, helper.js):");
            if (name && name.trim() !== "") {
                if (!backendFiles[name]) {
                    saveCurrentFile(); 
                    backendFiles[name] = "";
                    openFile(name);
                } else {
                    alert("File name already exists!");
                }
            }
        }

        function removeFile(event, fileName) {
            event.stopPropagation(); // Stop click from triggering openFile
            if(confirm(`Are you sure you want to delete ${fileName}?`)) {
                delete backendFiles[fileName];
                activeFile = Object.keys(backendFiles)[0];
                openFile(activeFile);
            }
        }

        async function runBackendCode() {
            saveCurrentFile(); 
            const lang = document.getElementById('langSelect').value;
            const terminal = document.getElementById('terminalBox');
            
            terminal.innerHTML = `<span style="color:#eab308;">➜ Compiling and executing ${Object.keys(backendFiles).length} file(s) on cloud...</span>\n\n`;
            
            let filesArray = Object.keys(backendFiles).map(name => {
                return { name: name, content: backendFiles[name] };
            });

            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: lang, version: globalVersions[lang], files: filesArray })
                });
                
                const data = await response.json();
                if (data.run.stderr) {
                    terminal.innerHTML += `<span style="color:#ef4444;">${data.run.stderr}</span>`;
                } else {
                    terminal.innerHTML += `<span style="color:#10b981;">Output:</span>\n${data.run.stdout}`;
                }
            } catch (error) {
                terminal.innerHTML = "<span style="color:#ef4444;">Error: Failed to connect to Cloud Server.</span>";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro IDE - CodeMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* NAVBAR */
        .navbar { background: #1e293b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .navbar h2 { color: #3b82f6; font-size: 22px; display: flex; align-items: center; gap: 10px; font-weight: 700;}
        .navbar h2 span { color: white; }
        
        /* MODE SWITCHER */
        .mode-toggle { display: flex; background: #0f172a; border-radius: 8px; border: 1px solid #334155; overflow: hidden; }
        .mode-btn { padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 14px; color: #94a3b8; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .mode-btn.active { background: #3b82f6; color: white; }
        
        /* 🌟 NAYA: Exit Button targeting Home Page */
        .exit-btn { color: #ef4444; font-weight: bold; text-decoration: none; padding: 8px 15px; border: 1px solid #ef4444; border-radius: 5px; transition: 0.3s; display: flex; align-items: center; gap: 8px;}
        .exit-btn:hover { background: #ef4444; color: white; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        /* WORKSPACE CONTAINERS */
        .workspace { display: flex; flex-grow: 1; height: calc(100vh - 70px); width: 100%; }
        .hidden { display: none !important; }

        /* 1. WEB DEVELOPMENT WORKSPACE */
        .web-workspace { flex-direction: column; }
        .web-editors { display: flex; height: 50%; border-bottom: 2px solid #334155; }
        .editor-box { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #334155; background: #1e293b;}
        .editor-header { padding: 8px 15px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; background: #0f172a; border-bottom: 1px solid #334155;}
        .editor-box textarea { flex-grow: 1; background: #1e293b; color: #f8fafc; font-family: 'Courier New', monospace; padding: 15px; border: none; outline: none; resize: none; font-size: 15px; line-height: 1.5;}
        
        .web-preview-area { height: 50%; display: flex; flex-direction: column; background: white; }
        .preview-header { background: #cbd5e1; color: #0f172a; padding: 5px 15px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px;}
        iframe { flex-grow: 1; border: none; width: 100%; height: 100%; }

        /* 2. UNIVERSAL CODING WORKSPACE */
        .code-workspace { display: flex; width: 100%; }
        .coding-left { width: 55%; display: flex; flex-direction: column; border-right: 2px solid #334155; }
        .coding-controls { padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;}
        
        /* 🌟 NAYA: Beautiful Dropdown for 70+ Languages */
        select { background: #1e293b; color: #10b981; border: 1px solid #3b82f6; padding: 8px 12px; border-radius: 5px; outline: none; font-weight: 600; font-size: 14px; cursor: pointer; max-width: 350px;}
        select optgroup { background: #0f172a; color: #94a3b8; font-style: normal; font-weight: bold; }
        select option { color: #f8fafc; font-weight: normal; }

        .run-btn { background: #10b981; color: white; border: none; padding: 8px 25px; border-radius: 5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: 0.3s; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);}
        .run-btn:hover { background: #059669; transform: translateY(-2px); }
        .run-btn:disabled { background: #64748b; cursor: not-allowed; transform: none; box-shadow: none;}

        .coding-left textarea { flex-grow: 1; background: #1e293b; color: #f8fafc; font-family: 'Courier New', monospace; padding: 20px; border: none; outline: none; resize: none; font-size: 16px; line-height: 1.6;}

        /* Terminal Side */
        .coding-right { width: 45%; display: flex; flex-direction: column; background: #000; }
        .terminal-header { background: #1e293b; padding: 12px 20px; font-size: 14px; color: #e2e8f0; font-weight: 600; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px;}
        .terminal-output { flex-grow: 1; padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 15px; color: #e2e8f0; overflow-y: auto; white-space: pre-wrap; }
        
        .text-success { color: #10b981; }
        .text-error { color: #ef4444; }
        .text-warning { color: #f59e0b; }
        .text-info { color: #3b82f6; }
    </style>
</head>
<body>
    
    <div class="navbar">
        <h2><i class="fas fa-laptop-code"></i> Code<span>Master</span></h2>
        <div class="mode-toggle">
            <div class="mode-btn active" id="btn-web" onclick="switchMode('web')"><i class="fab fa-html5"></i> Web Developer</div>
            <div class="mode-btn" id="btn-code" onclick="switchMode('code')"><i class="fas fa-terminal"></i> Pro Languages (75+)</div>
        </div>
        <a href="/" class="exit-btn"><i class="fas fa-power-off"></i> Exit IDE</a>
    </div>

    <div class="workspace web-workspace" id="webWorkspace">
        <div class="web-editors">
            <div class="editor-box">
                <div class="editor-header" style="color:#ef4444;"><i class="fab fa-html5"></i> HTML</div>
                <textarea id="htmlCode" onkeyup="compileWeb()"></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-header" style="color:#3b82f6;"><i class="fab fa-css3-alt"></i> CSS</div>
                <textarea id="cssCode" onkeyup="compileWeb()"></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-header" style="color:#eab308;"><i class="fab fa-js"></i> JavaScript</div>
                <textarea id="jsCode" onkeyup="compileWeb()"></textarea>
            </div>
        </div>
        <div class="web-preview-area">
            <div class="preview-header"><i class="fas fa-globe"></i> Live Browser Preview</div>
            <iframe id="webOutput"></iframe>
        </div>
    </div>

    <div class="workspace code-workspace hidden" id="codeWorkspace">
        <div class="coding-left">
            <div class="coding-controls">
                <select id="langSelect" onchange="changeLanguage()"></select>
                <button class="run-btn" id="runBtn" onclick="executeCode()"><i class="fas fa-play"></i> Run Code</button>
            </div>
            <textarea id="backendEditor" spellcheck="false"></textarea>
        </div>
        
        <div class="coding-right">
            <div class="terminal-header"><i class="fas fa-terminal"></i> Cloud Execution Terminal</div>
            <div class="terminal-output" id="terminalOutput">
<span class="text-success">CodeMaster Private Server [Cloud Engine Active]</span>
Ready to execute 75+ Programming Languages. Select a language and click Run.
            </div>
        </div>
    </div>

    <script>
        // 🌟 1. MOST POPULAR LANGUAGES (Top 15)
        const popularLangs = {
            "python3": { name: "🐍 Python 3", v: "4", boiler: "print('Hello CodeMaster! 🚀')\n\na = 10\nb = 20\nprint('Sum:', a + b)" },
            "java": { name: "☕ Java", v: "4", boiler: "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello Java Master! ☕\");\n    }\n}" },
            "cpp17": { name: "⚙️ C++ (C++17)", v: "0", boiler: "#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello C++ Ninja! ⚙️\" << endl;\n    return 0;\n}" },
            "c": { name: "🛠️ C", v: "5", boiler: "#include <stdio.h>\n\nint main() {\n    printf(\"Hello C Programmer! 🛠️\\n\");\n    return 0;\n}" },
            "nodejs": { name: "⚡ JavaScript (Node.js)", v: "4", boiler: "console.log('Hello from Node.js! ⚡');\nconst arr = [1, 2, 3];\nconsole.log(arr);" },
            "csharp": { name: "🎯 C#", v: "4", boiler: "using System;\nclass Program {\n  static void Main() {\n    Console.WriteLine(\"Hello C# World! 🎯\");\n  }\n}" },
            "php": { name: "🐘 PHP", v: "4", boiler: "<?php\n  echo \"Hello PHP Developer! 🐘\";\n?>" },
            "go": { name: "🐹 Go", v: "4", boiler: "package main\nimport \"fmt\"\nfunc main() {\n    fmt.Println(\"Hello Go Developer! 🐹\")\n}" },
            "rust": { name: "🦀 Rust", v: "4", boiler: "fn main() {\n    println!(\"Hello Rustacean! 🦀\");\n}" },
            "swift": { name: "🍏 Swift", v: "4", boiler: "print(\"Hello Swift Developer! 🍏\")" },
            "kotlin": { name: "🤖 Kotlin", v: "3", boiler: "fun main() {\n    println(\"Hello Kotlin Developer! 🤖\")\n}" },
            "ruby": { name: "💎 Ruby", v: "4", boiler: "puts 'Hello Ruby Developer! 💎'" },
            "r": { name: "📊 R", v: "4", boiler: "print(\"Hello Data Scientist! 📊\")" },
            "sql": { name: "🗄️ SQL", v: "4", boiler: "CREATE TABLE hello (message TEXT);\nINSERT INTO hello VALUES ('Hello SQL Developer!');\nSELECT * FROM hello;" },
            "bash": { name: "🐧 Bash", v: "4", boiler: "echo \"Hello Linux Master! 🐧\"" }
        };

        // 🌟 2. EXTRA 60+ LANGUAGES SUPPORTED BY JDOODLE
        const extraLangsData = [
            ['ada', 'Ada', '4'], ['awk', 'AWK', '4'], ['bc', 'bc', '4'], ['brainfuck', 'Brainfuck', '0'], 
            ['clojure', 'Clojure', '3'], ['cobol', 'COBOL', '3'], ['d', 'D', '2'], ['dart', 'Dart', '4'], 
            ['dc', 'dc', '4'], ['elixir', 'Elixir', '4'], ['erlang', 'Erlang', '0'], ['fasm', 'FASM', '0'], 
            ['fish', 'Fish', '4'], ['forth', 'Forth', '0'], ['fortran', 'Fortran', '4'], ['freebasic', 'FreeBasic', '1'], 
            ['fsharp', 'F#', '2'], ['groovy', 'Groovy', '4'], ['hack', 'Hack', '0'], ['haskell', 'Haskell', '4'], 
            ['icon', 'Icon', '1'], ['intercal', 'INTERCAL', '0'], ['j', 'J', '1'], ['julia', 'Julia', '4'], 
            ['lua', 'Lua', '3'], ['mozart', 'Mozart', '0'], ['nasm', 'NASM', '0'], ['nemerle', 'Nemerle', '0'], 
            ['nim', 'Nim', '4'], ['objc', 'Objective-C', '4'], ['ocaml', 'OCaml', '3'], ['octave', 'Octave', '4'], 
            ['pascal', 'Pascal', '3'], ['perl', 'Perl', '4'], ['picolisp', 'PicoLisp', '0'], ['pike', 'Pike', '0'], 
            ['prolog', 'Prolog', '1'], ['python2', 'Python 2', '3'], ['racket', 'Racket', '3'], ['rhino', 'Rhino JS', '1'], 
            ['scala', 'Scala', '4'], ['scheme', 'Scheme', '2'], ['sed', 'Sed', '1'], ['smalltalk', 'Smalltalk', '0'], 
            ['spidermonkey', 'SpiderMonkey', '1'], ['tcl', 'Tcl', '4'], ['unlambda', 'Unlambda', '0'], 
            ['vala', 'Vala', '0'], ['vbn', 'VB.Net', '3'], ['whitespace', 'Whitespace', '0'], ['yabasic', 'Yabasic', '1'], 
            ['zsh', 'Zsh', '4'], ['algol', 'Algol 68', '0'], ['befunge', 'Befunge', '0'], ['blockly', 'Blockly', '0'],
            ['cameo', 'Cameo', '0'], ['chicken', 'Chicken', '0'], ['clisp', 'Common Lisp', '0'], ['cow', 'Cow', '0'],
            ['gosh', 'Gauche', '0'], ['logo', 'Logo', '0'], ['malbolge', 'Malbolge', '0'], ['rexx', 'Rexx', '0'],
            ['spim', 'MIPS Assembly', '0']
        ];

        const otherLangs = {};
        extraLangsData.forEach(l => {
            otherLangs[l[0]] = { name: "📄 " + l[1], v: l[2], boiler: `// Write your ${l[1]} code here...\n` };
        });

        // Combine both objects for execution reference
        const allLangs = { ...popularLangs, ...otherLangs };

        document.addEventListener("DOMContentLoaded", () => {
            // Setup Web Code
            document.getElementById('htmlCode').value = `<div class="card">\n  <h1>Hello Developer! 🚀</h1>\n  <p>Start editing HTML, CSS, and JS to see changes instantly.</p>\n</div>`;
            document.getElementById('cssCode').value = `body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f4f8; font-family: sans-serif; margin: 0; }\n.card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }\nh1 { color: #3b82f6; }`;
            document.getElementById('jsCode').value = `console.log("Web Engine Active!");`;
            compileWeb(); 

            // 🌟 Setup Dropdown with Optgroups
            const select = document.getElementById('langSelect');
            let selectHTML = `<optgroup label="🔥 Most Popular">`;
            for(let key in popularLangs) {
                selectHTML += `<option value="${key}">${popularLangs[key].name}</option>`;
            }
            selectHTML += `</optgroup><optgroup label="📚 Other Languages (60+)">`;
            for(let key in otherLangs) {
                selectHTML += `<option value="${key}">${otherLangs[key].name}</option>`;
            }
            selectHTML += `</optgroup>`;
            select.innerHTML = selectHTML;
            
            select.value = 'python3';
            changeLanguage();
        });

        function switchMode(mode) {
            document.getElementById('btn-web').classList.remove('active');
            document.getElementById('btn-code').classList.remove('active');
            document.getElementById(`btn-${mode}`).classList.add('active');

            if (mode === 'web') {
                document.getElementById('codeWorkspace').classList.add('hidden');
                document.getElementById('webWorkspace').classList.remove('hidden');
            } else {
                document.getElementById('webWorkspace').classList.add('hidden');
                document.getElementById('codeWorkspace').classList.remove('hidden');
            }
        }

        function compileWeb() {
            try {
                const html = document.getElementById('htmlCode').value;
                const css = `<style>${document.getElementById('cssCode').value}</style>`;
                const js = "<scr" + "ipt>" + document.getElementById('jsCode').value + "</scr" + "ipt>";
                document.getElementById('webOutput').srcdoc = html + css + js;
            } catch(e) {}
        }

        function changeLanguage() {
            const langCode = document.getElementById('langSelect').value;
            document.getElementById('backendEditor').value = allLangs[langCode].boiler;
            document.getElementById('terminalOutput').innerHTML = `<span class="text-info">System Ready.</span> Selected ${allLangs[langCode].name}.\nClick 'Run Code' to execute.`;
        }

        async function executeCode() {
            const langCode = document.getElementById('langSelect').value;
            const code = document.getElementById('backendEditor').value;
            const version = allLangs[langCode].v;
            
            const terminal = document.getElementById('terminalOutput');
            const runBtn = document.getElementById('runBtn');

            if (!code.trim()) {
                terminal.innerHTML = `<span class="text-error">Error: Code editor is empty!</span>`;
                return;
            }

            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';
            terminal.innerHTML = `<span class="text-warning">➜ Authenticating via CodeMaster Secure API...\n➜ Executing on Cloud Engine...</span>\n\n`;

            try {
                const response = await fetch('/api/compile-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        script: code, 
                        language: langCode, 
                        versionIndex: version 
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    terminal.innerHTML += `<span class="text-error">Server Error: ${data.error}</span>`;
                } else if (data.statusCode !== 200) {
                    terminal.innerHTML += `<span class="text-error">Compilation Error:\n${data.output}</span>`;
                } else {
                    terminal.innerHTML += `<span class="text-success">Output:</span>\n${data.output}\n<span class="text-info">Memory: ${data.memory} KB | CPU Time: ${data.cpuTime} Sec</span>`;
                }
            } catch (error) {
                terminal.innerHTML = `<span class="text-error">Connection Failed! Ensure Backend Server is running.</span>`;
            }

            runBtn.disabled = false;
            runBtn.innerHTML = '<i class="fas fa-play"></i> Run Code';
        }
    </script>
</body>
</html>

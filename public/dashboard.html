<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - CodeMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; background: #f0f4f8; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 250px; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; z-index: 10; }
        .sidebar h2 { padding: 25px 20px; color: #3b82f6; font-weight: 700; font-size: 24px; border-bottom: 1px solid #e2e8f0; }
        .nav-links { list-style: none; padding: 20px 0; flex-grow: 1; }
        .nav-links li { padding: 15px 25px; cursor: pointer; color: #64748b; font-weight: 500; transition: 0.3s; }
        .nav-links li:hover, .nav-links li.active { background: #f8fafc; color: #3b82f6; border-right: 4px solid #3b82f6; }
        .logout-btn { padding: 15px; text-align: center; color: #ef4444; text-decoration: none; font-weight: 600; border-top: 1px solid #e2e8f0; display: block; }
        
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; position: relative; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        h1 { color: #1e293b; margin-bottom: 30px; font-size: 28px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; padding: 20px;}
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px;}
        .card-title { font-size: 18px; font-weight: 600; margin: 10px 0; }
        .btn { display: inline-block; width: 100%; padding: 12px; text-align: center; background: #3b82f6; color: white; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; transition: 0.3s;}
        .btn:hover { background: #2563eb; }
        .btn-success { background: #10b981; } .btn-success:hover { background: #059669; }
        .btn-danger { background: #ef4444; } .btn-danger:hover { background: #dc2626; }

        .result-box { background: white; padding: 40px; border-radius: 15px; max-width: 500px; margin: 0 auto; text-align: center; }
        .result-box input { width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 800px; max-width: 95%; max-height: 90vh; border-radius: 15px; display: flex; flex-direction: column; }
        .modal-header { background: #f8fafc; padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 30px; overflow-y: auto; flex-grow: 1; }
        
        /* 🌟 FIX: Locked input fields style */
        .exam-setup-form input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f1f5f9; color: #64748b; font-weight: bold; cursor: not-allowed; outline: none;}
        
        .question-block { margin-bottom: 20px; background: #f8fafc; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .option-label { display: block; padding: 10px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .timer-box { background: #fee2e2; color: #ef4444; font-size: 20px; font-weight: bold; padding: 10px 20px; border-radius: 8px; display: inline-block; margin-bottom: 20px; border: 2px solid #fca5a5;}
        
        .toast-popup { position: fixed; top: 30px; right: -400px; background: white; border-left: 6px solid #10b981; padding: 15px 25px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 15px; z-index: 1000; transition: right 0.5s; }
        .toast-popup.show { right: 30px; }
        .toast-icon { font-size: 28px; color: #10b981; }
    </style>
</head>
<body>

    <div id="loginToast" class="toast-popup">
        <i class="fas fa-check-circle toast-icon"></i>
        <div><h4 id="toastTitle">Welcome!</h4><p id="toastMessage">Logged in successfully.</p></div>
    </div>

    <div class="sidebar">
        <h2>CodeMaster</h2>
        <ul class="nav-links">
            <li class="active" onclick="switchTab('courses')">📚 My Courses</li>
            <li onclick="switchTab('exams')">📝 Live Exams</li>
            <li onclick="switchTab('results')">🏆 Check Result</li>
        </ul>
        <a href="/logout" onclick="logoutUser()" class="logout-btn">Logout</a>
    </div>

    <div class="main-content">
        <div id="courses-sec" class="section active">
            <h1>📚 Available Courses</h1>
            <div class="grid-container" id="coursesGrid"></div>
        </div>
        <div id="exams-sec" class="section">
            <h1>📝 Live Exams</h1>
            <div class="grid-container" id="examsGrid"></div>
        </div>
        <div id="results-sec" class="section">
            <h1 style="text-align: center;">🏆 CodeMaster Result</h1>
            <div class="result-box">
                <input type="text" id="resRollNo" placeholder="Enter Roll Number" required>
                <input type="password" id="resPass" placeholder="Enter Password" required>
                <button onclick="checkMyResult()" class="btn">View Result</button>
                <div id="resultDisplay" style="margin-top: 20px; text-align: left;"></div>
            </div>
        </div>
    </div>

    <div id="examModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalExamTitle">Exam Setup</h2>
                <span onclick="closeExam()" style="cursor:pointer; color:red; font-size:24px;">✖</span>
            </div>
            <div class="modal-body">
                <div id="examSetupForm" class="exam-setup-form">
                    <input type="text" id="exName" placeholder="Full Name" readonly>
                    <input type="text" id="exRoll" placeholder="Roll Number" readonly>
                    <input type="hidden" id="exId"><input type="hidden" id="exTitleName">
                    <button onclick="startExam()" class="btn btn-success">Start Exam</button>
                </div>
                <div id="examQuestionsArea" style="display:none;">
                    <div id="timerDisplay" class="timer-box">⏳ Time Left: 00:00</div>
                    <div id="questionsList"></div>
                    <button onclick="submitExam()" class="btn btn-success">Submit Exam</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let examTimer;
        let currentExamDuration = 0;
        let examData = null;
        let submittedExams = [];

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Login check and URL clean
            if(urlParams.get('login') === 'success') {
                localStorage.setItem('cm_name', urlParams.get('name') || '');
                localStorage.setItem('cm_roll', urlParams.get('roll') || '');
                window.history.replaceState({}, document.title, "/dashboard.html");
                
                document.getElementById('toastTitle').innerText = `Welcome, ${localStorage.getItem('cm_name')}!`;
                document.getElementById('loginToast').classList.add('show');
                setTimeout(() => document.getElementById('loginToast').classList.remove('show'), 4000);
            }

            // Security Lock
            if (!localStorage.getItem('cm_roll')) {
                alert("Session Expired or Not Logged In! Please Login First.");
                window.location.href = '/login.html';
                return;
            }

            document.getElementById('resRollNo').value = localStorage.getItem('cm_roll') || '';
            
            // Fetch exams student has already submitted
            try {
                const subRes = await fetch('/api/my-submissions', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ rollNo: localStorage.getItem('cm_roll') })
                });
                submittedExams = await subRes.json();
            } catch(e) { console.log(e); }

            loadCourses();
            loadExams();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-links li').forEach(l => l.classList.remove('active'));
            document.getElementById(tabId + '-sec').classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function loadCourses() {
            const res = await fetch('/api/courses');
            const data = await res.json();
            document.getElementById('coursesGrid').innerHTML = data.map(c => 
                `<div class="card"><img src="${c.thumbnail}"><div class="card-body"><h3 class="card-title">${c.title}</h3><a href="${c.videoLink}" target="_blank" class="btn btn-success">Watch Now</a></div></div>`
            ).join('');
        }

        async function loadExams() {
            const res = await fetch('/api/exams');
            const exams = await res.json();
            let html = '';
            
            exams.forEach(e => {
                // Ignore submitted exams
                if(submittedExams.includes(e.title)) return;

                html += `<div class="card" style="border-top:4px solid red;"><div class="card-body"><h3 class="card-title">${e.title}</h3><p class="card-text">Marks: ${e.totalMarks} | Time: ${e.duration}m</p><button onclick="openExam('${e._id}', '${e.title}', ${e.duration})" class="btn btn-danger">Attempt Exam</button></div></div>`;
            });

            if (html === '') {
                document.getElementById('examsGrid').innerHTML = '<p style="color:#10b981; font-weight:bold; font-size:18px;">🎉 You have completed all exams!</p>';
            } else {
                document.getElementById('examsGrid').innerHTML = html;
            }
        }

        function openExam(id, title, duration) {
            document.getElementById('modalExamTitle').innerText = title;
            document.getElementById('exId').value = id;
            document.getElementById('exTitleName').value = title;
            // 🌟 FIX: Name and Roll are auto-filled and locked!
            document.getElementById('exName').value = localStorage.getItem('cm_name') || '';
            document.getElementById('exRoll').value = localStorage.getItem('cm_roll') || '';
            
            currentExamDuration = duration;
            document.getElementById('examSetupForm').style.display = "block";
            document.getElementById('examQuestionsArea').style.display = "none";
            document.getElementById('examModal').style.display = "flex";
        }

        function closeExam() {
            clearInterval(examTimer);
            document.getElementById('examModal').style.display = "none";
        }

        async function startExam() {
            if(!document.getElementById('exName').value) return alert("System Error: No valid name found.");
            const res = await fetch(`/api/exams/${document.getElementById('exId').value}`);
            examData = await res.json();
            
            let qHtml = examData.questions.map((q, i) => `
                <div class="question-block"><h4>Q${i+1}: ${q.questionText}</h4>
                ${q.options.map(o => `<label class="option-label"><input type="radio" name="q${i}" value="${o}"> ${o}</label>`).join('')}
                </div>`).join('');
            
            document.getElementById('questionsList').innerHTML = qHtml;
            document.getElementById('examSetupForm').style.display = "none";
            document.getElementById('examQuestionsArea').style.display = "block";

            let time = currentExamDuration * 60;
            examTimer = setInterval(() => {
                time--;
                document.getElementById('timerDisplay').innerText = `⏳ Time Left: ${Math.floor(time/60)}:${time%60 < 10 ? '0':''}${time%60}`;
                if(time <= 0) { clearInterval(examTimer); alert("Time Up!"); submitExam(); }
            }, 1000);
        }

        async function submitExam() {
            clearInterval(examTimer);
            let answers = {};
            examData.questions.forEach((q, i) => {
                let ans = document.querySelector(`input[name="q${i}"]:checked`);
                answers[`Q${i+1}`] = ans ? ans.value : "Skipped";
            });

            const res = await fetch('/api/submit-exam', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
                studentName: document.getElementById('exName').value, 
                rollNo: document.getElementById('exRoll').value,
                examTitle: document.getElementById('exTitleName').value, 
                answers: answers
            })});
            
            const resultData = await res.json();

            // 🌟 FIX: Handle Backend Rejection if already submitted
            if(!resultData.success) {
                alert(resultData.message);
                closeExam();
                return;
            }

            alert("✅ Exam Submitted! Admin will check your copy.");
            closeExam();
            
            // Add to submitted list and reload UI to hide the exam immediately
            submittedExams.push(document.getElementById('exTitleName').value);
            loadExams(); 
        }

        async function checkMyResult() {
            const roll = document.getElementById('resRollNo').value;
            const pass = document.getElementById('resPass').value;
            const res = await fetch('/api/check-result', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ rollNo: roll, password: pass }) });
            const data = await res.json();
            if(!data.success) return alert(data.message);
            
            if(data.results.length === 0) {
                 document.getElementById('resultDisplay').innerHTML = "<p style='color:red;'>No checked copies found yet.</p>";
            } else {
                 document.getElementById('resultDisplay').innerHTML = data.results.map(r => `<div style="padding:15px; border:1px solid #ccc; margin-top:10px; border-radius:8px;"><b>${r.examTitle}</b> <span style="color:green; font-weight:bold; float:right;">${r.score} Marks</span></div>`).join('');
            }
        }

        function logoutUser() {
            localStorage.clear();
        }
    </script>
</body>
</html>

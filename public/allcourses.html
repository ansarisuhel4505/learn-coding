<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses - CodeMaster</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        .page-header { padding: 150px 5% 50px; text-align: center; }
        .page-header h1 { font-size: 40px; color: var(--text-main); margin-bottom: 15px; }
        
        .search-filter { display: flex; justify-content: center; gap: 15px; margin-bottom: 50px; padding: 0 5%; flex-wrap: wrap;}
        .search-box { display: flex; align-items: center; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 20px; width: 100%; max-width: 400px; }
        .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; margin-left: 10px; font-size: 15px;}
        .filter-btn { background: var(--primary-color); color: #fff; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        /* ==========================================
           🌙 UNIVERSAL DARK THEME FOR THIS PAGE 🌟
           ========================================== */
        body.dark-theme {
            background-color: #0f172a !important;
            color: #e2e8f0 !important;
        }
        /* सारे बॉक्सेस, कार्ड्स और साइडबार को डार्क करें */
        body.dark-theme .card, 
        body.dark-theme .modal-content, 
        body.dark-theme .sidebar, 
        body.dark-theme .left-panel, 
        body.dark-theme .auth-container,
        body.dark-theme .form-group {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }
        /* सारी हेडिंग्स और टेक्स्ट को वाइट (सफ़ेद) करें */
        body.dark-theme h1, body.dark-theme h2, body.dark-theme h3, 
        body.dark-theme h4, body.dark-theme p, body.dark-theme label, 
        body.dark-theme span, body.dark-theme th, body.dark-theme td {
            color: #f8fafc !important;
        }
        /* सारे इनपुट, टेक्स्ट बॉक्स और टेबल को डार्क करें */
        body.dark-theme input, body.dark-theme textarea, 
        body.dark-theme select, body.dark-theme table {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        /* रेज़्यूमे वाले A4 पेज को डार्क मोड में भी वाइट ही रहने दें (ताकि PDF न बिगड़े) */
        body.dark-theme .a4-paper {
            background-color: #ffffff !important;
            color: #0f172a !important;
        }
    </style>
</head>
<body>
<a href="/" class="back-to-home-btn" title="Back to Home">
    <i class='bx bxs-home-heart'></i>
</a>


    <div class="page-header">
        <h1>Explore Our <span>Courses</span></h1>
        <p style="color: var(--text-muted);">Find the perfect course to level up your skills.</p>
    </div>

    <div class="search-filter">
        <div class="search-box">
            <i class='bx bx-search' style="color: var(--text-muted); font-size: 20px;"></i>
            <input type="text" placeholder="Search for Web Dev, AI, Python...">
        </div>
        <button class="filter-btn">Search</button>
    </div>

    <section class="learning-path" style="padding: 0 5% 80px;">
        <div class="course-grid" id="dynamic-courses" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px;">
            <p style="text-align: center; width: 100%; color: var(--text-muted);">Loading courses from database...</p>
        </div>
    </section>

   
    <script src="script.js"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            document.documentElement.classList.add('dark-theme');
        }
    </script>
</body>
</html>

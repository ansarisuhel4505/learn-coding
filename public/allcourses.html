<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Courses - CodeMaster</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        :root {
            --bg-body: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-bg: #eff6ff;
            --discount-color: #ef4444;
            --price-color: #10b981;
        }

        /* Dark Mode Theme */
        html.dark-theme, html.dark-theme body, body.dark-theme {
            --bg-body: #0b1120;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary-bg: rgba(59, 130, 246, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--bg-body); 
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 🌟 Floating Back to Home Button */
        .back-to-home-btn {
            position: fixed; top: 25px; left: 25px;
            background: var(--bg-card); color: var(--primary);
            width: 45px; height: 45px; display: flex; justify-content: center; align-items: center;
            border-radius: 50%; font-size: 24px; text-decoration: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: all 0.3s ease;
            border: 1px solid var(--border-color); z-index: 100;
        }
        .back-to-home-btn:hover { 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none;
            transform: translateY(-3px); box-shadow: 0 8px 20px rgba(59,130,246,0.4); 
        }

        /* 🌟 Page Header */
        .page-header { 
            padding: 120px 5% 40px; text-align: center; 
        }
        .page-header h1 { 
            font-size: 46px; color: var(--text-main); margin-bottom: 10px; font-weight: 800; letter-spacing: -1px;
        }
        .page-header h1 span { 
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .page-header p { 
            color: var(--text-muted); max-width: 600px; margin: 0 auto; font-size: 18px; 
        }

        /* 🌟 Search & Filter */
        .search-container { 
            display: flex; justify-content: center; margin-bottom: 50px; padding: 0 5%;
        }
        .search-box {
            display: flex; align-items: center; background: var(--bg-card); 
            border: 2px solid var(--border-color); border-radius: 50px; 
            padding: 8px 25px; width: 100%; max-width: 600px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: all 0.3s ease;
        }
        .search-box:focus-within {
            border-color: var(--primary); box-shadow: 0 15px 35px rgba(59,130,246,0.15); transform: translateY(-2px);
        }
        .search-box input {
            background: transparent; border: none; color: var(--text-main); 
            width: 100%; outline: none; margin-left: 15px; font-size: 16px; padding: 10px 0;
        }
        .search-box i { font-size: 22px; color: var(--text-muted); }

        /* 🌟 Courses Grid */
        .course-container { padding: 0 5% 80px; max-width: 1300px; margin: 0 auto; }
        .course-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; 
        }

        /* 🌟 Ultimate Course Card Design */
        .course-card {
            background: var(--bg-card); border-radius: 24px; overflow: hidden;
            border: 1px solid var(--border-color); box-shadow: 0 15px 35px rgba(0,0,0,0.04);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column;
            position: relative;
        }
        .course-card:hover {
            transform: translateY(-10px); border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(59,130,246,0.15);
        }
        
        .img-wrapper { position: relative; width: 100%; height: 220px; overflow: hidden; }
        .course-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .course-card:hover .course-img { transform: scale(1.05); }
        
        /* 🔥 Mega Discount Badge */
        .discount-badge {
            position: absolute; top: 15px; right: 15px;
            background: var(--discount-color); color: white; padding: 6px 15px;
            border-radius: 20px; font-weight: 800; font-size: 13px; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); z-index: 10;
            animation: pulseBg 2s infinite;
        }
        @keyframes pulseBg {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .course-content { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .course-title { font-size: 22px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; line-height: 1.3;}
        .course-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;}
        
        /* 💰 Pricing Section */
        .price-box { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-top: 15px; border-top: 1px dashed var(--border-color);}
        .current-price { font-size: 26px; font-weight: 800; color: var(--text-main); }
        .old-price { font-size: 16px; color: var(--text-muted); text-decoration: line-through; font-weight: 500;}
        
        /* 🎬 Action Button */
        .enroll-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; 
            width: 100%; text-align: center; padding: 14px; border-radius: 12px; 
            text-decoration: none; font-weight: 700; font-size: 16px;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(59,130,246,0.3);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .enroll-btn:hover { background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: 0 8px 25px rgba(59,130,246,0.5); }

        .loading-text { text-align: center; color: var(--primary); font-size: 20px; font-weight: 600; grid-column: 1 / -1; margin-top: 50px;}

        @media (max-width: 600px) {
            .page-header { padding: 100px 5% 30px; }
            .page-header h1 { font-size: 34px; }
            .back-to-home-btn { top: 15px; left: 15px; width: 40px; height: 40px; font-size: 20px; }
        }
    </style>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
            window.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-theme'));
        }
    </script>
</head>
<body>

    <a href="/" class="back-to-home-btn" title="Back to Home">
        <i class='bx bxs-home-heart'></i>
    </a>

    <div class="page-header">
        <h1>Master Skills with <span>Premium Courses</span></h1>
        <p>Grab the limited-time discount! Start learning Full-Stack, AI, and more today.</p>
    </div>

    <div class="search-container">
        <div class="search-box">
            <i class='bx bx-search'></i>
            <input type="text" id="searchInput" placeholder="Search for Web Dev, AI, Python..." onkeyup="filterCourses()">
        </div>
    </div>

    <section class="course-container">
        <div class="course-grid" id="dynamic-courses">
            <div class="loading-text">
                <i class="fas fa-spinner fa-spin"></i> Fetching Premium Courses...
            </div>
        </div>
    </section>

    <script>
        let allCourses = [];

        // Fetch courses from your actual API
        async function fetchCourses() {
            try {
                const res = await fetch('/api/courses');
                allCourses = await res.json();
                renderCourses(allCourses);
            } catch (error) {
                document.getElementById('dynamic-courses').innerHTML = `<p style="text-align:center; color:red; grid-column: 1/-1;">Error loading courses. Please check your internet connection.</p>`;
            }
        }

        // Render Courses with Stunning UI
        function renderCourses(courses) {
            const grid = document.getElementById('dynamic-courses');
            
            if (courses.length === 0) {
                grid.innerHTML = `<p style="text-align:center; color:var(--text-muted); grid-column: 1/-1;">No courses found!</p>`;
                return;
            }

            let html = '';
            courses.forEach(c => {
                html += `
                <div class="course-card">
                    <div class="img-wrapper">
                        <span class="discount-badge">75% OFF</span>
                        <img src="${c.thumbnail}" class="course-img" alt="${c.title}">
                    </div>
                    
                    <div class="course-content">
                        <h3 class="course-title">${c.title}</h3>
                        <p class="course-desc">${c.description}</p>
                        
                        <div class="price-box">
                            <span class="current-price">₹499</span>
                            <span class="old-price">₹1999</span>
                        </div>
                        
                        <a href="${c.videoLink}" target="_blank" class="enroll-btn">
                            <i class="fas fa-play-circle"></i> Start Learning Now
                        </a>
                    </div>
                </div>`;
            });

            grid.innerHTML = html;
        }

        // 🔍 Search Filter Logic
        function filterCourses() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCourses.filter(c => 
                c.title.toLowerCase().includes(query) || 
                c.description.toLowerCase().includes(query)
            );
            renderCourses(filtered);
        }

        // Run fetch on load
        window.onload = fetchCourses;
    </script>

</body>
</html>

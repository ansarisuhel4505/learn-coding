<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeMaster</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: #0f172a; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 20px; color: #3b82f6; }
        
        /* Form Inputs */
        .input-group { position: relative; margin: 15px 0; }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px 12px 12px 45px; /* Icon ke liye jagah */
            border-radius: 5px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 15px;
        }
        input:focus { border-color: #3b82f6; }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .login-btn:hover { background: #2563eb; }

        /* Google Login Button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            background: white;
            color: #333;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .google-btn:hover { background: #f1f5f9; }
        .google-btn img { width: 20px; margin-right: 10px; }

        .divider { margin: 15px 0; color: #64748b; font-size: 14px; }
        p { margin-top: 15px; font-size: 14px; color: #94a3b8; }
        a { color: #3b82f6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Welcome Back 👋</h2>

        <a href="/auth/google" class="google-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
            Continue with Google
        </a>

        <div class="divider">OR LOGIN WITH EMAIL</div>

        <form action="/login" method="POST">
            <div class="input-group">
                <i class='bx bxs-envelope'></i>
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>
            
            <div class="input-group">
                <i class='bx bxs-lock-alt'></i>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>
            
            <button type="submit" class="login-btn">Login</button>
        </form>

        <p>Don't have an account? <a href="/signup">Sign up here</a></p>
        <p><a href="/">Back to Home</a></p>
    </div>

</body>
</html>
